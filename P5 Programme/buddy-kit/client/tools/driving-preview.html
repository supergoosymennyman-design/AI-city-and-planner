<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driving School · local design review</title>
<style>body{margin:0;background:#c7d1c0;font:14px system-ui;color:#fff}canvas{display:block}nav{position:absolute;top:16px;left:16px;display:flex;gap:8px;flex-wrap:wrap;max-width:90vw;background:#24343d;padding:12px}select,button{font:inherit;padding:8px;border:0;border-radius:3px}output{position:absolute;bottom:12px;left:16px;background:#24343d;padding:8px}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<nav><select id="view" aria-label="Camera view"><option>Overview</option><option>Entrance</option><option>Chase</option><option>First bend</option><option>Second bend</option><option>Encounter</option></select><select id="exercise" aria-label="Exercise"><option>mixed</option><option>signal</option><option>amber</option><option>pedestrian</option><option>barrier</option><option>moving-car</option></select><select id="language" aria-label="Sign language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select><button id="rebuild">Reopen venue</button></nav><output></output>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {renderDrivingCourse,loadDrivingAudi} from '../city-common/driving-presentation.js';import {schoolScenario,pointAt} from '../city-common/driving-simulation.js';
const view=document.querySelector('#view'),exercise=document.querySelector('#exercise'),language=document.querySelector('#language');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#c7d1c0');scene.add(new THREE.HemisphereLight(0xffffff,0x71806a,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-70,100,-40);scene.add(sun);const camera=new THREE.PerspectiveCamera(48,1,.1,1000);const controls=new OrbitControls(camera,renderer.domElement);let root,scenario;
function dispose(g){const seen=new Set();g.traverse(o=>{if(o.isInstancedMesh)o.dispose();for(const r of [o.geometry,...(Array.isArray(o.material)?o.material:[o.material])])if(r&&!seen.has(r)){seen.add(r);for(const v of Object.values(r))if(v?.isTexture&&!seen.has(v)){seen.add(v);v.dispose();}r.dispose();}});g.removeFromParent();}
async function rebuild(){if(root)dispose(root);root=new THREE.Group();scene.add(root);scenario=schoolScenario(exercise.value,71);renderDrivingCourse(root,scenario,{language:language.value});const own=root;const car=await loadDrivingAudi();if(root!==own){dispose(car);return;}const p=pointAt(scenario.track,3);car.position.set(p.x,.15,p.z);car.rotation.y=p.heading;root.add(car);frame();window.ready=true;}
function frame(){let s=0;if(view.value==='First bend')s=78;if(view.value==='Second bend')s=145;if(view.value==='Encounter')s=scenario.track.light?.s??scenario.actors[0]?.s??35;const p=pointAt(view.value==='Encounter'?scenario.track:scenario.courseTrack,s);if(view.value==='Overview'){camera.position.set(85,140,175);controls.target.set(-35,0,68);}else{const chase=view.value==='Chase';camera.position.set(p.x-Math.sin(p.heading)*(chase?11:19)+Math.cos(p.heading)*(chase?0:17),chase?5:13,p.z-Math.cos(p.heading)*(chase?11:19)-Math.sin(p.heading)*(chase?0:17));controls.target.set(p.x,1,p.z+4);}controls.update();}
view.onchange=frame;exercise.onchange=rebuild;language.onchange=rebuild;document.querySelector('#rebuild').onclick=rebuild;function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}onresize=resize;resize();await rebuild();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);document.querySelector('output').textContent=`${renderer.info.render.calls} draw calls · ${renderer.info.memory.geometries} geometries · ${renderer.info.memory.textures} textures`;});window.review={renderer,scene,camera,controls,get root(){return root;},rebuild};
</script></html>
