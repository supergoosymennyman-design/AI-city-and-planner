<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="glow-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="glow-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg-grad)" rx="16"/>
  <text x="200" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">P5 AI CHAMPION</text>

  <!-- ═══ ANTENNA ═══ -->
  <line x1="200" y1="104" x2="200" y2="74" stroke="#3498DB" stroke-width="2.5"/>
  <circle cx="200" cy="70" r="6" fill="#2ECC71" filter="url(#glow)"/>
  <text x="215" y="68" font-family="sans-serif" font-size="8" fill="#2ECC71">Sky-Sense L14</text>

  <!-- ═══ HEAD ═══ -->
  <rect x="160" y="106" width="80" height="60" rx="14" fill="#1e293b" stroke="#3498DB" stroke-width="2" filter="url(#shadow)"/>
  <!-- Camera eye -->
  <circle cx="200" cy="126" r="10" fill="#0f172a" stroke="#2ECC71" stroke-width="2"/>
  <circle cx="200" cy="126" r="4" fill="#2ECC71" filter="url(#glow)"/>
  <text x="200" y="154" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#2ECC71" font-weight="600">Recycle-Eye L1</text>

  <!-- ═══ NECK ═══ -->
  <rect x="188" y="166" width="24" height="12" rx="4" fill="#334155"/>

  <!-- ═══ CHEST / TORSO ═══ -->
  <rect x="150" y="180" width="100" height="120" rx="12" fill="#1e293b" stroke="#3498DB" stroke-width="2" filter="url(#shadow)"/>

  <!-- Sensor grid on chest -->
  <rect x="165" y="192" width="70" height="36" rx="6" fill="#0f172a" stroke="#2ECC71" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="214" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#2ECC71">DEEP-SCAN SENSE L2</text>

  <!-- Heart core -->
  <circle cx="200" cy="250" r="16" fill="#0f172a" stroke="#E74C3C" stroke-width="2.5"/>
  <path d="M192 248 C192 240 208 240 208 248 L200 256 Z" fill="#E74C3C" filter="url(#glow)"/>
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#E74C3C" font-weight="600">Judgment-Core L12</text>
  <!-- Chest side labels -->
  <text x="144" y="222" text-anchor="end" font-family="sans-serif" font-size="7" fill="#3498DB">Mood-Sense L16</text>
  <text x="256" y="240" text-anchor="start" font-family="sans-serif" font-size="7" fill="#3498DB">Cost-Sense L15</text>

  <!-- ═══ SHOULDERS + DRONE PADS ═══ -->
  <rect x="120" y="190" width="28" height="16" rx="8" fill="#1e293b" stroke="#3498DB" stroke-width="1.5"/>
  <rect x="252" y="190" width="28" height="16" rx="8" fill="#1e293b" stroke="#3498DB" stroke-width="1.5"/>
  <text x="134" y="202" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#94a3b8">🛸</text>
  <text x="266" y="202" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#94a3b8">🛸</text>
  <text x="134" y="176" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#94a3b8">Twin L5</text>

  <!-- ═══ ARMS ═══ -->
  <!-- Left arm -->
  <rect x="130" y="220" width="16" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="126" y="280" width="24" height="20" rx="6" fill="#1e293b" stroke="#F39C12" stroke-width="1.5"/>
  <text x="120" y="298" text-anchor="end" font-family="sans-serif" font-size="6" fill="#F39C12">Grip L6</text>
  <!-- Right arm -->
  <rect x="254" y="220" width="16" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="250" y="280" width="24" height="20" rx="6" fill="#1e293b" stroke="#F39C12" stroke-width="1.5"/>

  <!-- ═══ WAIST ═══ -->
  <rect x="162" y="302" width="76" height="14" rx="4" fill="#334155"/>

  <!-- ═══ LEGS ═══ -->
  <rect x="168" y="318" width="20" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="212" y="318" width="20" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- ═══ ROVER WHEELS ═══ -->
  <rect x="162" y="368" width="32" height="14" rx="7" fill="#1e293b" stroke="#2ECC71" stroke-width="2"/>
  <circle cx="170" cy="375" r="3" fill="#2ECC71"/>
  <circle cx="186" cy="375" r="3" fill="#2ECC71"/>
  <rect x="206" y="368" width="32" height="14" rx="7" fill="#1e293b" stroke="#2ECC71" stroke-width="2"/>
  <circle cx="214" cy="375" r="3" fill="#2ECC71"/>
  <circle cx="230" cy="375" r="3" fill="#2ECC71"/>
  <text x="200" y="398" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#2ECC71">Rover-Legs L3</text>

  <!-- ═══ HAUL BACKPACK ═══ -->
  <rect x="252" y="234" width="22" height="36" rx="6" fill="#1e293b" stroke="#3498DB" stroke-width="1.5"/>
  <text x="280" y="252" font-family="sans-serif" font-size="6" fill="#94a3b8">Haul L6</text>

  <!-- ═══ FOOTER LABELS ═══ -->
  <text x="200" y="430" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">🟢 = earned · ⬜ = to be unlocked</text>
  <text x="200" y="446" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">17 abilities across 4 clusters</text>

  <!-- Legend circles -->
  <circle cx="160" cy="440" r="5" fill="#2ECC71"/>
  <text x="170" y="444" font-family="sans-serif" font-size="8" fill="#64848b">Earned ability</text>
  <circle cx="260" cy="440" r="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="270" y="444" font-family="sans-serif" font-size="8" fill="#64848b">Unearned</text>
</svg>
