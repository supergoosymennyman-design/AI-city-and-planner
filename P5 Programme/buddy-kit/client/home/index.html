<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI City — Champion Hub</title>
  <meta name="description" content="Pick a place to play, build, and meet your AI champion.">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="home.css">
  <script src="/crash-guard.js"></script>
</head>
<body>
  <div class="hub">
    <header class="hub-header">
      <img class="hub-champion" src="champion-illustration.svg" alt="Your AI Champion" width="84" height="84">
      <div>
        <h1 class="hub-title">My AI City</h1>
        <p class="hub-sub">Pick a place to play, build, and meet your champion.</p>
      </div>
      <span class="hub-status" aria-hidden="true">HUB · ONLINE</span>
    </header>

    <main>
      <div class="card-grid" id="card-grid" aria-label="Choose a place"></div>
    </main>

    <footer class="hub-footer">Made for young city-builders · No data leaves your device</footer>
  </div>

  <script type="module" src="home.js"></script>
</body>
</html>
