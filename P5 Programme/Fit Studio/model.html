<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fit Studio — Model edition</title><style>body{margin:0;background:#10181d;color:#edf4f2;font:16px system-ui;overflow:hidden}#view{position:fixed;inset:0}aside{position:fixed;z-index:2;left:16px;top:16px;width:min(330px,calc(100vw - 32px));background:#17242bcc;border:1px solid #60747a;border-radius:14px;padding:14px;backdrop-filter:blur(8px)}h1{font-size:18px;margin:0 0 6px}p{font-size:13px;line-height:1.4;color:#c9d8d5}button,input{font:inherit}button{margin:4px 3px 0 0;padding:9px 10px;border-radius:8px;border:1px solid #6f8382;background:#25353a;color:white;font-weight:700}button.primary{background:#00a991;color:#06221e}#status{display:block;margin-top:8px;font-size:13px;color:#b7d8d1}</style></head><body><div id="view"></div><aside><h1>Fit Studio · Model edition</h1><p>Adjust this one City object. Add parts, choose a part, tint it, then save a new local revision. Original stays available through City undo.</p><input id="parts" type="file" accept=".glb" hidden><button id="add">Add GLB part</button><input id="tint" type="color" value="#00bda8"><button id="undo">Undo</button><button id="redo">Redo</button><br><button id="cancel">Cancel</button><button id="save" class="primary">Save to City</button><span id="status">Opening model…</span></aside><script type="module" src="./model.js"></script></body></html>
