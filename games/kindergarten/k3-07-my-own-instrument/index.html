    function addSound(name) {
      const idx = state.soundIndex;
      const color = getSoundColor(idx);
      const colorHex = getSoundColorHex(idx);

      let blob = state.recordingBlob;
      if (!blob && state._fallbackSound) {
        // Create a minimal blob for fallback
        try {
          blob = new Blob(['dummy'], { type: 'audio/webm' });
        } catch(e) { blob = null; }
      }

      const url = blob ? URL.createObjectURL(blob) : null;
      state.sounds.push({
        name: name,
        color: color,
        colorHex: colorHex,
        blob: blob,
        url: url,
        fallback: !!state._fallbackSound
      });

      state.recordingBlob = null;
      state._fallbackSound = false;

      if (typeof GameTranscript !== 'undefined') {
        GameTranscript.add('child', `Named sound: ${name}`);
      }

      // Check if done
      if (state.sounds.length >= TOTAL_SOUNDS) {
        transitionTo('sound_bank_complete');
      } else {
        state.soundIndex++;
        transitionTo('record');
      }
    }

    // ---- SOUND BANK COMPLETE ----
    function renderSoundBankComplete() {
      main.innerHTML = `
        <div class="screen text-center">
          <p class="text-large mb-md">Your instrument is ready!</p>
          <p class="text-small mb-md">You have ${TOTAL_SOUNDS} amazing sounds!</p>
          <div class="sound-bank mb-lg">
            ${state.sounds.map((s, i) => `
              <span class="sound-icon pop-in" style="background:${s.color};animation-delay:${i * 0.1}s">
                <span class="sound-abbr">${getSoundAbbr(s.name)}</span>
              </span>
            `).join('')}
          </div>
          <p class="text-small">Now let's make a song with your sounds!</p>
        </div>
      `;

      const names = state.sounds.map(s => s.name).join(', ');
      setSpeechText(`Now I know your instrument! It has 5 sounds: ${names}! Let's make a song!`);
      updateAIState('listening', 'Listening');
      setRobotExpression('happy');
      headerTitle.textContent = 'My Instrument';

      // Auto-transition after robot finishes speaking
      setTimeout(() => {
        transitionTo('sequencer_intro');
      }, 3000);
    }

    // ---- SEQUENCER INTRO ----
    function renderSequencerIntro() {
      initGrid();
      main.innerHTML = `
        <div class="screen text-center">
          <p class="text-large mb-md">Now let's build your song!</p>
          <p class="text-small mb-md">Tap the squares to place your sounds on the beat grid.</p>
          <button class="btn btn-secondary btn-lg mt-md" id="btn-start-grid" aria-label="Start building your song">
            Start Building!
          </button>
        </div>
      `;
      setSpeechText('Tap the squares to place your sounds! Each row is a sound, each column is a beat.');
      updateAIState('listening', 'Listening');

      document.getElementById('btn-start-grid').addEventListener('click', () => {
        transitionTo('sequencer_edit');
      });
    }

    function initGrid() {
      state.grid = Array.from({ length: TOTAL_SOUNDS }, () => Array(TOTAL_BEATS).fill(false));
      state.playCount = 0;
      state.totalPlaythroughs = 0;
    }

    // ---- SEQUENCER EDIT ----
    function renderSequencerEdit() {
      const hasAnyFilled = state.grid.some(row => row.some(cell => cell));

      main.innerHTML = `
        <div class="screen" style="padding:0;">
          <div class="sequencer-wrapper" role="grid" aria-label="Beat sequencer grid. 5 sounds across 8 beats.">
            <div class="seq-header">
              <span class="seq-row-label" style="background:transparent;"></span>
              ${Array.from({length: TOTAL_BEATS}, (_, b) =>
                `<span class="beat-num" role="columnheader">${b + 1}</span>`
              ).join('')}
            </div>
            ${state.sounds.map((s, rowIdx) => `
              <div class="seq-row" role="row">
                <span class="seq-row-label" style="color:${s.color};">
                  <span class="label-dot" style="background:${s.color};"></span>
                  ${getSoundAbbr(s.name)}
                </span>
                ${Array.from({length: TOTAL_BEATS}, (_, beatIdx) => {
                  const filled = state.grid[rowIdx][beatIdx];
                  const soundClass = filled ? `sound-${rowIdx} filled` : '';
                  const activeClass = state.currentBeat === beatIdx ? 'active-beat' : '';
                  return `<button class="seq-cell ${soundClass} ${activeClass}"
                    role="gridcell"
                    aria-label="Sound ${s.name} on beat ${beatIdx + 1}, ${filled ? 'filled' : 'empty'}"
                    data-row="${rowIdx}" data-beat="${beatIdx}"
                    aria-pressed="${filled ? 'true' : 'false'}"></button>`;
                }).join('')}
              </div>
            `).join('')}
          </div>
          <div class="seq-controls">
            <button class="btn btn-secondary btn-lg btn-icon-sm" id="btn-seq-play" aria-label="Play your beat sequence">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6,4 20,12 6,20"/>
              </svg>
            </button>
            <button class="btn btn-outline btn-sm" id="btn-seq-clear" aria-label="Clear all beats"${state.clearCooldown ? ' disabled' : ''}>
              &#8634; Clear
            </button>
          </div>
          <div class="sound-bank-sidebar mt-sm">
            ${state.sounds.map((s, i) => `
              <span class="sound-icon" style="background:${s.color};width:36px;height:36px;font-size:10px;">
                <span class="sound-abbr">${getSoundAbbr(s.name)}</span>
              </span>
            `).join('')}
          </div>
          <p class="text-small mt-sm" id="seq-status">
            ${hasAnyFilled ? 'Tap cells to add or remove sounds. Press play to hear it!' : 'Tap a square to start!'}
          </p>
          ${state.totalPlaythroughs >= 2 ? `
            <button class="btn btn-accent btn-lg mt-sm" id="btn-lock" aria-label="Lock in your song">
              &#128274; Lock In Song!
            </button>
          ` : ''}
        </div>
      `;

      setSpeechText(hasAnyFilled
        ? 'Great pattern! Press play to hear your song!'
        : 'Tap the empty squares to add your sounds to the beat! Try putting your favorite sound on beat 1!');
      updateAIState('listening', 'Listening');
      headerTitle.textContent = 'Build Your Song';

      // Cell toggle
      document.querySelectorAll('.seq-cell').forEach(el => {
        el.addEventListener('click', () => {
          const row = parseInt(el.dataset.row, 10);
          const beat = parseInt(el.dataset.beat, 10);
          toggleCell(row, beat);
        });
      });

      document.getElementById('btn-seq-play').addEventListener('click', () => {
        // Check if grid has any sounds
        const filled = state.grid.some(r => r.some(c => c));
        if (!filled) {
          setSpeechText('Your grid is empty! Tap some squares to add sounds first!');
          return;
        }
        transitionTo('sequencer_play');
      });

      document.getElementById('btn-seq-clear').addEventListener('click', () => {
        if (state.clearCooldown) return;
        state.clearCooldown = true;
        initGrid();
        renderSequencerEdit();
        setTimeout(() => { state.clearCooldown = false; }, 1500);
      });

      const lockBtn = document.getElementById('btn-lock');
      if (lockBtn) {
        lockBtn.addEventListener('click', () => {
          transitionTo('lock_song');
        });
      }

      // Idle prompt
      startIdleTimer(15000, () => {
        if (currentState === 'sequencer_edit') {
          const filled = state.grid.some(r => r.some(c => c));
          if (!filled) {
            if (state.idlePromptCount < 3) {
              aiSay('Tap a square to add a sound! Try putting your first sound on beat 1!', null, 'neutral');
              state.idlePromptCount++;
            } else {
              // Auto-fill a simple pattern
              autoFillGrid();
              renderSequencerEdit();
              state.idlePromptCount = 0;
            }
          } else {
            aiSay('Press the play button to hear your song!', null, 'happy');
          }
        }
      });
    }

    function toggleCell(row, beat) {
      // 150ms debounce to prevent rapid double-tap
      if (state._cellCooldown) return;
      state._cellCooldown = true;
      setTimeout(() => { state._cellCooldown = false; }, 150);

      if (row >= 0 && row < TOTAL_SOUNDS && beat >= 0 && beat < TOTAL_BEATS) {
        state.grid[row][beat] = !state.grid[row][beat];
        // Update the cell visual
        const cells = document.querySelectorAll(`.seq-cell[data-row="${row}"][data-beat="${beat}"]`);
        cells.forEach(el => {
          const filled = state.grid[row][beat];
          el.classList.toggle('filled', filled);
          el.classList.toggle(`sound-${row}`, filled);
          el.setAttribute('aria-pressed', filled ? 'true' : 'false');
          el.setAttribute('aria-label', `Sound ${state.sounds[row].name} on beat ${beat + 1}, ${filled ? 'filled' : 'empty'}`);
        });
        // Update status
        const status = document.getElementById('seq-status');
        if (status) {
          const hasAny = state.grid.some(r => r.some(c => c));
          status.textContent = hasAny ? 'Tap cells to add or remove sounds. Press play to hear it!' : 'Tap a square to start!';
        }
      }
    }

    function autoFillGrid() {
      if (state.sounds.length > 0) {
        // Simple pattern: sound 0 on beats 0,4; sound 1 on beats 2,6 if available
        state.grid[0][0] = true;
        state.grid[0][4] = true;
        if (state.sounds.length > 1) {
          state.grid[1][2] = true;
          state.grid[1][6] = true;
        }
      }
    }

    // ---- SEQUENCER PLAY ----
    function renderSequencerPlay() {
      // Show the grid with play animation
      renderSequencerEdit();

      // Start playback
      startSequencer(() => {
        state.totalPlaythroughs++;
        if (state.totalPlaythroughs >= 2) {
          // Show lock button
          const existingBtn = document.getElementById('btn-lock');
          if (!existingBtn) {
            const controls = document.querySelector('.seq-controls');
            if (controls) {
              const lockBtn = document.createElement('button');
              lockBtn.className = 'btn btn-accent btn-lg mt-sm';
              lockBtn.id = 'btn-lock';
              lockBtn.innerHTML = '&#128274; Lock In Song!';
              lockBtn.setAttribute('aria-label', 'Lock in your song');
              lockBtn.addEventListener('click', () => {
                stopSequencer();
                transitionTo('lock_song');
              });
              controls.parentNode.appendChild(lockBtn);
            }
          }
        }
      });
    }

    function startSequencer(onComplete) {
      if (state.isPlaying) return;
      state.isPlaying = true;
      state.currentBeat = -1;

      const beatMs = 60000 / DEFAULT_TEMPO;

      function playBeat(beatIndex) {
        if (!state.isPlaying) return;

        // Clear previous highlight
        document.querySelectorAll('.seq-cell.active-beat').forEach(el => {
          el.classList.remove('active-beat');
        });

        if (beatIndex >= TOTAL_BEATS) {
          // Loop complete
          state.isPlaying = false;
          state.currentBeat = -1;
          if (onComplete) onComplete();
          // Return to edit mode
          if (currentState === 'sequencer_play' || currentState === 'sequencer_edit') {
            transitionTo('sequencer_edit');
          }
          return;
        }

        state.currentBeat = beatIndex;

        // Highlight current beat column
        document.querySelectorAll(`.seq-cell[data-beat="${beatIndex}"]`).forEach(el => {
          el.classList.add('active-beat');
        });

        // Play sounds on this beat
        for (let s = 0; s < TOTAL_SOUNDS; s++) {
          if (state.grid[s][beatIndex] && state.sounds[s]) {
            playSoundAsset(s);
          }
        }

        setTimeout(() => playBeat(beatIndex + 1), beatMs);
      }

      sequencerInterval = setTimeout(() => playBeat(0), 100);
    }

    function stopSequencer() {
      state.isPlaying = false;
      state.currentBeat = -1;
      if (sequencerInterval) {
        clearTimeout(sequencerInterval);
        sequencerInterval = null;
      }
      document.querySelectorAll('.seq-cell.active-beat').forEach(el => {
        el.classList.remove('active-beat');
      });
    }

    function playSoundAsset(soundIndex) {
      const sound = state.sounds[soundIndex];
      if (!sound) return;
      if (sound.fallback || !sound.blob) {
        // Play oscillator tone as fallback
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 300 + soundIndex * 80;
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
          setTimeout(() => ctx.close().catch(()=>{}), 300);
        } catch(e) {}
      } else if (sound.url) {
        try {
          const audio = new Audio(sound.url);
          audio.volume = 0.7;
          audio.play().catch(() => {});
        } catch(e) {}
      }
    }

    // ---- LOCK SONG ----
    function renderLockSong() {
      main.innerHTML = `
        <div class="screen text-center">
          <p class="text-large mb-md">Song locked in!</p>
          <p class="text-small mb-md">Now AI will add a melody to your rhythm!</p>
          <div class="composing-animation mb-md">
            <span class="music-note">&#9835;</span>
            <span class="music-note">&#9833;</span>
            <span class="music-note">&#9834;</span>
            <span class="music-note">&#9835;</span>
            <span class="music-note">&#9833;</span>
          </div>
        </div>
      `;
      setSpeechText('You made a great song! Now AI will remix it with drums, bass, and a melody!');
      updateAIState('thinking', 'Composing');

      setTimeout(() => {
        transitionTo('ai_composing');
      }, 2000);
    }

    // ---- AI COMPOSING ----
    function renderAIComposing() {
      main.innerHTML = `
        <div class="screen text-center">
          <p class="text-large mb-md">AI is composing...</p>
          <div class="composing-animation mb-md">
            <span class="music-note">&#9835;</span>
            <span class="music-note">&#9833;</span>
            <span class="music-note">&#9834;</span>
            <span class="music-note">&#9835;</span>
            <span class="music-note">&#9833;</span>
          </div>
          <div class="composing-progress">
            <div class="composing-progress-bar" id="compose-progress"></div>
          </div>
          <p class="text-small mt-md" id="compose-text">Analyzing your rhythm...</p>
        </div>
      `;
      setSpeechText('I\'m analyzing your rhythm and building a full remix — drums, bass, and melody!');
      updateAIState('thinking', 'Composing');

      // Analyze pattern
      const analysis = analyzePattern();

      // Animate progress
      const progressBar = document.getElementById('compose-progress');
      const composeText = document.getElementById('compose-text');
      let progress = 0;

      const messages = [
        [0, 'Analyzing your rhythm...'],
        [20, 'Building drum pattern...'],
        [40, 'Writing a bass line...'],
        [60, 'Composing a lead melody...'],
        [80, 'Mixing your sounds with the beat...'],
        [100, 'Ready to rock!']
      ];
      let msgIdx = 0;

      const interval = setInterval(() => {
        progress += 2;
        if (progressBar) progressBar.style.width = Math.min(100, progress) + '%';
        if (msgIdx < messages.length && progress >= messages[msgIdx][0]) {
          if (composeText) composeText.textContent = messages[msgIdx][1];
          msgIdx++;
        }
        if (progress >= 100) {
          clearInterval(interval);
          // Create backing track engine
          backingTrack = new BackingTrackEngine(DEFAULT_TEMPO, TOTAL_BEATS);
          const summary = backingTrack.generate(analysis.density, analysis.activeCount, state.grid);
          console.log('Backing track:', summary);
          transitionTo('ai_playing');
        }
      }, 60);
    }

    function analyzePattern() {
      let totalCells = 0;
      let activeCells = 0;
      const freq = Array(TOTAL_SOUNDS).fill(0);

      for (let s = 0; s < TOTAL_SOUNDS; s++) {
        for (let b = 0; b < TOTAL_BEATS; b++) {
          totalCells++;
          if (state.grid[s][b]) {
            activeCells++;
            freq[s]++;
          }
        }
      }

      const density = activeCells / totalCells;
      const activeCount = freq.filter(f => f > 0).length;

      return { density, activeCount, freq };
    }

    // ---- AI PLAYING ----
    function renderAIPlaying() {
      main.innerHTML = `
        <div class="screen text-center">
          <p class="text-large mb-md">&#127925; Your Song — AI Remix!</p>
          <p class="text-small mb-md" id="aiplay-status">Starting the remix...</p>
          <div class="sequencer-wrapper" style="max-width:420px;">
            <div class="seq-header" style="padding-left:44px;">
              ${Array.from({length: TOTAL_BEATS}, (_, b) =>
                `<span class="beat-num">${b + 1}</span>`
              ).join('')}
            </div>
            ${state.sounds.map((s, rowIdx) => `
              <div class="seq-row">
                <span class="seq-row-label" style="width:40px;height:36px;font-size:10px;color:${s.color};">
                  ${getSoundAbbr(s.name)}
                </span>
                ${Array.from({length: TOTAL_BEATS}, (_, beatIdx) => {
                  const filled = state.grid[rowIdx][beatIdx];
                  return `<span class="seq-cell ${filled ? `sound-${rowIdx} filled` : ''}"
                    style="width:36px;height:36px;pointer-events:none;"
                    data-beat="${beatIdx}"></span>`;
                }).join('')}
              </div>
            `).join('')}
          </div>
          <div class="seq-controls mt-sm">
            <button class="btn btn-secondary" id="btn-aiplay-stop" aria-label="Stop playback">Stop</button>
          </div>
        </div>
      `;
      setSpeechText('Listen to the AI remix! Your sounds with drums, bass, and a melody!');
      updateAIState('speaking', 'Playing');
      setRobotExpression('amazed');

      let playing = true;

      // Start the backing track engine — handles ALL audio (drums, bass, user sounds, lead)
      if (backingTrack) {
        backingTrack.play(
          state.sounds,
          state.grid,
          // onBeat — highlight the current beat column
          (beatIndex) => {
            if (!playing) return;
            // Clear previous highlights
            document.querySelectorAll('.seq-cell.active-beat').forEach(el => {
              el.classList.remove('active-beat');
            });
            // Highlight current beat column
            document.querySelectorAll(`.seq-cell[data-beat="${beatIndex}"]`).forEach(el => {
              el.classList.add('active-beat');
            });
            // Update status
            const statusEl = document.getElementById('aiplay-status');
            if (statusEl) {
              const emojis = ['🥁', '🎵', '🎶', '🎸', '🎹', '🥁', '🎵', '🎶'];
              statusEl.textContent = `${emojis[beatIndex] || '🎵'} AI Remix — beat ${beatIndex + 1}`;
            }
          },
          // onComplete — transition to celebration
          () => {
            if (playing) {
              playing = false;
              document.querySelectorAll('.seq-cell.active-beat').forEach(el => {
                el.classList.remove('active-beat');
              });
              transitionTo('celebration');
            }
          }
        );
      }

      // Stop button
      document.getElementById('btn-aiplay-stop').addEventListener('click', () => {
        playing = false;
        if (backingTrack) backingTrack.stop();
        document.querySelectorAll('.seq-cell.active-beat').forEach(el => {
          el.classList.remove('active-beat');
        });
        transitionTo('sequencer_edit');
      });
    }

    // ---- CELEBRATION ----
    function renderCelebration() {
      main.innerHTML = `
        <div class="screen text-center">
          <p class="celebration-title">&#127881; You Taught AI!</p>
          <p class="text-large mt-md">You taught AI about your instrument,</p>
          <p class="text-large">and together you made a song!</p>
          <div class="flex-col gap-md mt-lg" style="align-items:center;">
            <button class="btn btn-secondary btn-lg" id="btn-replay" aria-label="Play together again!">
              &#128260; Play Together Again!
            </button>
            <button class="btn btn-outline" id="btn-start-over" aria-label="Start over">
              &#8634; Start Over
            </button>
          </div>
        </div>
      `;
      setSpeechText('Amazing! We made a song together! Your sounds + AI drums, bass, and melody! Your instrument rocks!');
      updateAIState('listening', 'Listening');
      setRobotExpression('amazed');
      headerTitle.textContent = 'We Made Music!';

      // Confetti
      launchConfetti();

      document.getElementById('btn-replay').addEventListener('click', () => {
        transitionTo('sequencer_edit');
      });

      document.getElementById('btn-start-over').addEventListener('click', () => {
        resetGame();
      });
    }

    // ===================================================================
    // CONFETTI
    // ===================================================================
    function launchConfetti() {
      const container = document.getElementById('confetti-container');
      if (!container) return;
      container.innerHTML = '';

      const colors = SOUND_COLOR_HEX;
      const pieces = 40;

      for (let i = 0; i < pieces; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const delay = Math.random() * 1.5;
        const size = 8 + Math.random() * 10;
        piece.style.cssText = `
          left: ${left}%;
          background: ${color};
          width: ${size}px;
          height: ${size}px;
          border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
          animation-delay: ${delay}s;
          animation-duration: ${1.5 + Math.random() * 1}s;
        `;
        container.appendChild(piece);
      }

      // Clean up
      setTimeout(() => { container.innerHTML = ''; }, 4000);
    }

    // ===================================================================
    // IDLE TIMER
    // ===================================================================
    function startIdleTimer(delay, callback) {
      clearIdleTimer();
      state.idleTimer = setTimeout(callback, delay);
    }

    function clearIdleTimer() {
      if (state.idleTimer) {
        clearTimeout(state.idleTimer);
        state.idleTimer = null;
      }
    }

    // ===================================================================
    // RESET
    // ===================================================================
    function resetGame() {
      stopSequencer();
      if (backingTrack) { backingTrack.stop(); backingTrack = null; }
      recorder.release();
      // Revoke all blob URLs
      state.sounds.forEach(s => {
        if (s.url) URL.revokeObjectURL(s.url);
      });
      state.sounds = [];
      state.soundIndex = 0;
      state.playCount = 0;
      state.totalPlaythroughs = 0;
      state.recordingBlob = null;
      state.isRecording = false;
      state.isPlaying = false;
      state.currentBeat = -1;
      state.grid = [];
      state.micGranted = false;
      state.useOscillatorFallback = false;
      state.idlePromptCount = 0;
      state.recordingRetries = 0;
      state._cellCooldown = false;
      state.clearCooldown = false;
      state.isTransitioning = false;
      if (typeof GameTranscript !== 'undefined') GameTranscript.clear();
      recorder = new SoundRecorder();
      // Re-init mic
      transitionTo('init');
    }

    // ===================================================================
    // HELPER: Sound bank dots
    // ===================================================================
    function renderSoundBankDots() {
      let html = '';
      for (let i = 0; i < TOTAL_SOUNDS; i++) {
        if (i < state.sounds.length) {
          const s = state.sounds[i];
          html += `<span class="sound-icon" style="background:${s.color}">
            <span class="sound-abbr">${getSoundAbbr(s.name)}</span>
          </span>`;
        } else {
          html += `<span class="sound-icon future">
            <span class="sound-abbr">${i + 1}</span>
          </span>`;
        }
      }
      return html;
    }

    // ===================================================================
    // EVENT: Visibility change
    // ===================================================================
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // Pause
        if (state.isPlaying) stopSequencer();
        if (backingTrack) backingTrack.stop();
        recorder.isActive = false;
      }
    });

    // ===================================================================
    // EVENT: Settings toggle
    // ===================================================================
    document.getElementById('settings-toggle').addEventListener('click', () => {
      if (typeof GameSettings !== 'undefined') GameSettings.show();
    });

    document.getElementById('transcript-toggle').addEventListener('click', () => {
      if (typeof GameTranscript !== 'undefined') GameTranscript.show();
    });

    // ===================================================================
    // INIT — Wait for DOM + modules
    // ===================================================================
    function boot() {
      // Initialize settings & transcript UI
      if (typeof GameSettings !== 'undefined') {
        GameSettings.renderModal(document.getElementById('modal-container'));
      }
      if (typeof GameTranscript !== 'undefined') {
        GameTranscript.renderDrawer(document.getElementById('drawer-container'));
      }
      // Start the game
      transitionTo('init');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }

  })();
  </script>
</body>
