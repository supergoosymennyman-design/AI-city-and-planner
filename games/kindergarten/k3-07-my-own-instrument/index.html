<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Own Instrument</title>
  <style>
    /* ===================================================================
       DESIGN TOKENS
       =================================================================== */
    :root {
      /* Core palette */
      --bg-cream: #FFF9F0;
      --bg-white: #FFFFFF;
      --primary: #CC4444;
      --primary-hover: #B33A3A;
      --secondary: #1A7A74;
      --secondary-hover: #156865;
      --accent-gold: #FFD93D;
      --accent-gold-hover: #E8C430;
      --text-dark: #2D2D2D;
      --text-medium: #666666;
      --text-light: #999999;
      --bg-cell-empty: #F0F0F0;
      --border-cell: #D0D0D0;
      --shadow: rgba(0,0,0,0.1);
      --shadow-strong: rgba(0,0,0,0.2);
      --success: #6BCB77;
      --error: #FF6B6B;

      /* Sound colors */
      --sound-1: #FF6B6B;
      --sound-2: #4ECDC4;
      --sound-3: #FFD93D;
      --sound-4: #6BCB77;
      --sound-5: #A084E8;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --body-size: 20px;
      --button-size: 18px;
      --heading-size: 24px;

      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;

      /* Border radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-sm: 0 2px 4px var(--shadow);
      --shadow-md: 0 4px 12px var(--shadow);
      --shadow-lg: 0 8px 24px var(--shadow);

      /* Robot colors */
      --robot-body: #D4D4D4;
      --robot-head: #E8E8E8;
      --robot-eye-bg: #FFFFFF;
      --robot-eye-pupil: #333333;
      --robot-accent: #4ECDC4;
    }

    /* ===================================================================
       RESET & BASE
       =================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-family);
      font-size: var(--body-size);
      line-height: 1.4;
      color: var(--text-dark);
      background: var(--bg-cream);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ===================================================================
       APP LAYOUT
       =================================================================== */
    #app {
      width: 100%;
      height: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: env(safe-area-inset-top, 44px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
    }

    /* ===================================================================
       HEADER
       =================================================================== */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) 0;
      flex-shrink: 0;
      min-height: 56px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .header-actions {
      display: flex;
      gap: var(--space-sm);
      align-items: center;
    }

    .header-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--bg-white);
      color: var(--text-dark);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: transform 150ms, box-shadow 150ms;
      touch-action: manipulation;
    }

    .header-btn:active {
      transform: scale(0.92);
    }

    /* ===================================================================
       MAIN CONTENT AREA
       =================================================================== */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: var(--space-sm) 0;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      animation: fadeIn 300ms ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===================================================================
       ROBOT CHARACTER
       =================================================================== */
    #robot-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
      max-width: 400px;
      margin-bottom: var(--space-sm);
    }

    .robot-container {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      width: 100%;
    }

    .robot-svg {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .robot-body {
      fill: var(--robot-body);
      stroke: #B0B0B0;
      stroke-width: 1.5;
    }

    .robot-head-bg {
      fill: var(--robot-head);
      stroke: #B0B0B0;
      stroke-width: 1.5;
    }

    .robot-eye {
      fill: var(--robot-eye-bg);
      stroke: #999;
      stroke-width: 1;
    }

    .robot-pupil {
      fill: var(--robot-eye-pupil);
      transition: all 200ms ease;
    }

    .robot-pupil.happy {
      fill: var(--secondary);
    }

    .robot-pupil.amazed {
      fill: var(--accent-gold);
      r: 8;
    }

    .robot-mouth {
      fill: none;
      stroke: #999;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .robot-mouth.smile {
      d: path("M25,55 Q35,62 45,55");
    }

    .robot-mouth.open {
      d: path("M28,53 Q35,62 42,53");
    }

    /* Speech bubble */
    .speech-bubble {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-md);
      position: relative;
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-right: 12px solid var(--bg-white);
    }

    .speech-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.5;
      width: 100%;
    }

    /* AI State Indicator */
    #state-indicator {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      margin-top: var(--space-xs);
      font-size: 14px;
      color: var(--text-medium);
    }

    .state-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #CCC;
      transition: background 300ms;
    }

    .state-dot.listening {
      background: #22C55E;
      animation: pulse-dot 2s infinite;
    }

    .state-dot.thinking {
      background: #EAB308;
      animation: pulse-dot 1s infinite;
    }

    .state-dot.speaking {
      background: #3B82F6;
      animation: wave-dot 1.5s infinite;
    }

    .state-dot.idle {
      background: #9CA3AF;
    }

    .state-dot.error {
      background: #EF4444;
    }

    .state-label {
      font-size: 13px;
      font-weight: 500;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    @keyframes wave-dot {
      0%, 100% { opacity: 1; transform: scaleY(1); }
      25% { transform: scaleY(1.5); }
      50% { transform: scaleY(1); }
      75% { transform: scaleY(1.3); }
    }

    /* ===================================================================
       BUTTONS
       =================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--button-size);
      font-weight: 700;
      padding: var(--space-md) var(--space-lg);
      cursor: pointer;
      transition: transform 150ms, box-shadow 150ms, background 150ms;
      touch-action: manipulation;
      min-height: 56px;
      min-width: 56px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      transform: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 0 var(--primary-hover);
    }

    .btn-primary:active {
      box-shadow: 0 1px 0 var(--primary-hover);
      transform: translateY(3px);
    }

    .btn-secondary {
      background: var(--secondary);
      color: white;
      box-shadow: 0 4px 0 var(--secondary-hover);
    }

    .btn-secondary:active {
      box-shadow: 0 1px 0 var(--secondary-hover);
      transform: translateY(3px);
    }

    .btn-accent {
      background: var(--accent-gold);
      color: var(--text-dark);
      box-shadow: 0 4px 0 var(--accent-gold-hover);
    }

    .btn-accent:active {
      box-shadow: 0 1px 0 var(--accent-gold-hover);
      transform: translateY(3px);
    }

    .btn-white {
      background: var(--bg-white);
      color: var(--text-dark);
      box-shadow: var(--shadow-md);
    }

    .btn-white:active {
      box-shadow: var(--shadow-sm);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-dark);
      border: 2px solid var(--border-cell);
    }

    .btn-sm {
      font-size: 16px;
      padding: var(--space-sm) var(--space-md);
      min-height: 48px;
    }

    .btn-lg {
      font-size: 22px;
      padding: var(--space-md) var(--space-xl);
      min-height: 72px;
      min-width: 72px;
    }

    .btn-icon {
      width: 72px;
      height: 72px;
      padding: 0;
      border-radius: 50%;
    }

    .btn-icon-sm {
      width: 56px;
      height: 56px;
      padding: 0;
      border-radius: 50%;
    }

    /* ===================================================================
       MIC BUTTON
       =================================================================== */
    .mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 44px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
      transition: transform 150ms, box-shadow 150ms;
      touch-action: manipulation;
    }

    .mic-btn:active {
      transform: scale(0.95);
    }

    .mic-btn.recording {
      animation: mic-pulse 1.5s infinite ease-in-out;
      box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.5);
    }

    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.5); }
      50% { box-shadow: 0 0 0 20px rgba(255, 107, 107, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
    }

    .mic-btn svg {
      width: 48px;
      height: 48px;
    }

    /* Recording ring around mic */
    .recording-ring-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .recording-ring {
      position: absolute;
      top: -14px;
      left: -14px;
      width: 128px;
      height: 128px;
      transform: rotate(-90deg);
    }

    .recording-ring .bg-circle {
      fill: none;
      stroke: #E8E8E8;
      stroke-width: 6;
    }

    .recording-ring .progress-circle {
      fill: none;
      stroke: var(--primary);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 339.292;
      stroke-dashoffset: 339.292;
      transition: stroke-dashoffset 50ms linear;
    }

    /* ===================================================================
       SOUND BANK
       =================================================================== */
    .sound-bank {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      flex-wrap: wrap;
      padding: var(--space-sm) 0;
    }

    .sound-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      position: relative;
      transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: var(--shadow-sm);
    }

    .sound-icon.pop-in {
      animation: popIn 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .sound-icon.future {
      background: var(--bg-cell-empty);
      border: 2px dashed var(--border-cell);
      color: var(--text-light);
    }

    .sound-icon .sound-abbr {
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }

    .sound-icon .sound-check {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 18px;
      height: 18px;
      background: var(--success);
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* ===================================================================
       NAME SUGGESTION BUTTONS
       =================================================================== */
    .name-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      justify-content: center;
      max-width: 400px;
    }

    .name-btn {
      min-width: 80px;
      height: 56px;
    }

    /* ===================================================================
       SEQUENCER GRID
       =================================================================== */
    .sequencer-wrapper {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-x: auto;
      padding: var(--space-xs) 0;
    }

    .sequencer-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .seq-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 52px;
      margin-bottom: 2px;
    }

    .seq-header .beat-num {
      width: 44px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-medium);
      flex-shrink: 0;
    }

    .seq-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .seq-row-label {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dark);
      border-radius: var(--radius-sm);
      text-align: center;
      line-height: 1.1;
    }

    .seq-row-label .label-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .seq-cell {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-cell);
      background: var(--bg-cell-empty);
      cursor: pointer;
      transition: background 150ms, transform 100ms, border-color 150ms;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .seq-cell:active {
      transform: scale(0.9);
    }

    .seq-cell.filled {
      border-color: transparent;
      box-shadow: inset 0 2px 4px var(--shadow-strong);
    }

    .seq-cell.active-beat {
      outline: 3px solid var(--accent-gold);
      outline-offset: 2px;
      transform: scale(1.08);
      z-index: 2;
    }

    .seq-cell.sound-0 { background: var(--sound-1); }
    .seq-cell.sound-1 { background: var(--sound-2); }
    .seq-cell.sound-2 { background: var(--sound-3); }
    .seq-cell.sound-3 { background: var(--sound-4); }
    .seq-cell.sound-4 { background: var(--sound-5); }

    /* Sequencer controls */
    .seq-controls {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: var(--space-sm) 0;
    }

    /* ===================================================================
       COMPOSING / LOADING
       =================================================================== */
    .composing-animation {
      display: flex;
      gap: var(--space-md);
      align-items: flex-end;
      justify-content: center;
      height: 80px;
    }

    .music-note {
      font-size: 28px;
      color: var(--secondary);
      animation: bounce-note 0.6s infinite alternate ease-in-out;
    }

    .music-note:nth-child(2) { animation-delay: 0.2s; }
    .music-note:nth-child(3) { animation-delay: 0.4s; }
    .music-note:nth-child(4) { animation-delay: 0.1s; }
    .music-note:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce-note {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    .composing-progress {
      width: 200px;
      height: 8px;
      background: var(--bg-cell-empty);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .composing-progress-bar {
      height: 100%;
      background: var(--secondary);
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 200ms linear;
    }

    /* ===================================================================
       CELEBRATION
       =================================================================== */
    .celebration-title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
    }

    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 100;
    }

    .confetti-piece {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      top: -20px;
      animation: confetti-fall 2s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ===================================================================
       SETTINGS MODAL
       =================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn 200ms ease-out;
    }

    .modal-content {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      max-width: 400px;
      width: calc(100% - 32px);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      width: 40px;
      height: 40px;
      border: none;
      background: var(--bg-cell-empty);
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-medium);
    }

    .modal-close-btn:active {
      background: var(--border-cell);
    }

    .settings-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: var(--space-lg);
      padding-right: 40px;
    }

    .setting-row {
      margin-bottom: var(--space-md);
    }

    .setting-label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: var(--space-xs);
      color: var(--text-dark);
    }

    .setting-control {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .setting-control input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-cell-empty);
      border-radius: 3px;
      outline: none;
    }

    .setting-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--secondary);
      cursor: pointer;
      border: 2px solid white;
      box-shadow: var(--shadow-sm);
    }

    .setting-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-medium);
      min-width: 40px;
      text-align: right;
    }

    .setting-control select {
      flex: 1;
      padding: var(--space-sm) var(--space-md);
      border: 2px solid var(--border-cell);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font-family);
      background: var(--bg-white);
      color: var(--text-dark);
    }

    .setting-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 28px;
      display: inline-block;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #CCC;
      border-radius: 28px;
      transition: background 200ms;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 22px; height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 200ms;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--secondary);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    .setting-info {
      margin-top: var(--space-md);
      font-size: 13px;
      color: var(--text-light);
      text-align: center;
    }

    /* ===================================================================
       TRANSCRIPT DRAWER
       =================================================================== */
    .transcript-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 320px;
      max-width: 90vw;

      background: var(--bg-white);

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .transcript-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      border-bottom: 1px solid var(--bg-cell-empty);

    .transcript-header h2 {

    .transcript-close-btn {

    .transcript-list {

    }

    .transcript-empty {

    }

    .transcript-entry {
      font-size: 14px;

      line-height: 1.4;
    }

    .transcript-child {
      background: #F0F7FF;
      align-self: flex-start;
    }

    .transcript-ai {
      background: #F5F5F5;
      align-self: flex-end;
    }

    .transcript-time {
      font-size: 11px;
      color: var(--text-light);
      margin-right: var(--space-xs);
    }

    .transcript-label {
      font-weight: 700;
      margin-right: var(--space-xs);
    }

    .transcript-footer {
      padding: var(--space-sm) var(--space-md);
      border-top: 1px solid var(--bg-cell-empty);
    }

    .transcript-clear-btn {
      width: 100%;
      padding: var(--space-sm);
      border: 1px solid var(--border-cell);
      border-radius: var(--radius-sm);
      background: var(--bg-white);
      font-size: 14px;

      color: var(--text-medium);

    /* ===================================================================
       SOUND BANK (SEQUENCER SIDEBAR)
       =================================================================== */
    .sound-bank-sidebar {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;

    .sound-bank-sidebar .sound-icon {

    /* ===================================================================
       RESPONSIVE
       =================================================================== */
    @media (min-width: 600px) {
      .seq-cell { width: 64px; height: 64px; }
      .seq-header .beat-num { width: 64px; }
      .seq-row-label { width: 56px; height: 64px; font-size: 12px; }

    @media (orientation: landscape) and (max-height: 500px) {

      .speech-text { font-size: 15px; }

    /* ===================================================================
       REDUCED MOTION
       =================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .screen { animation: none; opacity: 1; transform: none; }
      .confetti-container { display: none; }
      .sound-icon.pop-in { animation: none; transform: scale(1); }
      .mic-btn.recording { animation: none; }
    }

    /* ===================================================================
       UTILITY
       =================================================================== */
    .text-center { text-align: center; }

    .text-small { font-size: 16px; color: var(--text-medium); }

    .mt-md { margin-top: var(--space-md); }

    .flex-center { display: flex; align-items: center; justify-content: center; }

    .sr-only {

      width: 1px; height: 1px;

      overflow: hidden;
      clip: rect(0,0,0,0);

    }
  </style>

  <!-- Load conversation modules FIRST -->

  <script src="intents.js"></script>
  <script src="settings.js"></script>
  <script src="transcript.js"></script>

  <script>
  /* ===================================================================
     GAME — My Own Instrument
     =================================================================== */

  (function() {
    'use strict';

    // ===================================================================
    // CONSTANTS
    // ===================================================================
    const TOTAL_SOUNDS = 5;
    const TOTAL_BEATS = 8;
    const DEFAULT_TEMPO = 120;
    const RECORD_DURATION = 3000; // 3 seconds
    const SOUND_COLORS = [
      'var(--sound-1)',
      'var(--sound-2)',
      'var(--sound-3)',
      'var(--sound-4)',
      'var(--sound-5)'
    ];
    const SOUND_COLOR_HEX = ['#FF6B6B', '#4ECDC4', '#FFD93D', '#6BCB77', '#A084E8'];
    const RECORD_PROMPTS = [
      'Make a sound with your voice! Sing, hum, or say something!',
      'Clap your hands together!',
      'Stomp your feet on the floor!',
      'Tap the table or a surface near you!',
      'Make a funny sound! Whistle, blow a raspberry, or be creative!'
    ];
    const NAME_SUGGESTIONS = [
      ['La-la', 'Ahh', 'Sing', 'Hum', 'Hey'],
      ['Clap', 'Pat', 'Slap', 'Tap', 'Beat'],
      ['Stomp', 'Boom', 'Kick', 'Thump', 'Stamp'],
      ['Tap', 'Tick', 'Knock', 'Click', 'Rap'],
      ['Whoosh', 'Ding', 'Buzz', 'Zap', 'Boom']
    ];

    // ===================================================================
    // GAME STATE
    // ===================================================================
    const state = {
      currentState: 'init',
      sounds: [],          // Array of { name, color, colorHex, blob, url }
      soundIndex: 0,       // Current sound being recorded (0-4)
      playCount: 0,        // Number of full sequencer plays
      recordingBlob: null, // Temporary blob during record phase
      isRecording: false,
      isPlaying: false,
      currentBeat: -1,
      grid: [],            // 5x8 boolean grid
      micGranted: false,
      useOscillatorFallback: false,
      idlePromptCount: 0,
      totalPlaythroughs: 0,
      idleTimer: null,
      aiPhraseQueue: [],
      isTransitioning: false,
      _cellCooldown: false,      // 150ms debounce for grid cells
      clearCooldown: false,      // 1.5s cooldown for clear button
      recordingRetries: 0,       // Silent recording retry counter per sound

      // Sequencer
      seqSoundSources: [], // Pre-created Audio objects for fast playback
    };

    // ===================================================================
    // DOM REFS
    // ===================================================================
    const $ = id => document.getElementById(id);
    const main = $('main-content');
    const speechText = $('speech-text');
    const stateDot = $('state-dot');
    const stateLabel = $('state-label');
    const headerTitle = $('header-title');

    // ===================================================================
    // SOUND RECORDER
    // ===================================================================
    class SoundRecorder {
      constructor() {
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.stream = null;
        this.timerId = null;
        this.startTime = 0;
        this.isActive = false;
        this.onProgress = null;
        this.onComplete = null;
        this.onTick = null;
      }

      async requestMic() {
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          return true;
        } catch (err) {
          console.warn('Mic access denied:', err);
          return false;
        }
      }

      startRecording(duration = RECORD_DURATION) {
        if (!this.stream) return;
        this.audioChunks = [];
        this.isActive = true;
        this.startTime = Date.now();

        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : 'audio/webm';

        this.mediaRecorder = new MediaRecorder(this.stream, { mimeType });
        this.mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) this.audioChunks.push(e.data);
        };
        this.mediaRecorder.start();

        // Auto-stop timer
        this.timerId = setTimeout(() => {
          this.stopRecording().then(blob => {
            if (this.onComplete) this.onComplete(blob);
          });
        }, duration);

        // Progress tick
        this._tick(duration);
      }

      _tick(duration) {
        if (!this.isActive) return;
        const elapsed = Date.now() - this.startTime;
        const progress = Math.min(1, elapsed / duration);
        const remaining = Math.max(0, duration - elapsed);
        if (this.onTick) this.onTick(progress, remaining);
        if (this.isActive && elapsed < duration) {
          requestAnimationFrame(() => this._tick(duration));
        }
      }

      stopRecording() {
        return new Promise((resolve) => {
          if (!this.mediaRecorder || this.mediaRecorder.state === 'inactive') {
            resolve(null);
            return;
          }
          this.isActive = false;
          if (this.timerId) { clearTimeout(this.timerId); this.timerId = null; }
          this.mediaRecorder.onstop = () => {
            if (this.audioChunks.length === 0) { resolve(null); return; }
            const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
            resolve(blob);
          };
          try { this.mediaRecorder.stop(); } catch (e) { resolve(null); }
        });
      }

      playBlob(blob) {
        return new Promise((resolve) => {
          if (!blob) { resolve(); return; }
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
          audio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
          audio.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
        });
      }

      release() {
        this.isActive = false;
        if (this.timerId) { clearTimeout(this.timerId); this.timerId = null; }
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
        }
      }
    }

    // ===================================================================
    // BACKING TRACK ENGINE — Drum machine + bass + user sound remix
    // ===================================================================
    //
    // Synthesizes a full backing track using:
    //   - Kick drum  (sine pitch-sweep)
    //   - Snare      (triangle body + bandpassed noise)
    //   - Hi-hat     (square wave → bandpass filter)
    //   - Bass line  (triangle wave, chord-root pattern)
    //   - Lead       (twin detuned triangles, pentatonic phrase)
    //   - User sounds (decoded from blob, played at 30% volume)
    //
    // Everything is scheduled via AudioContext.currentTime for
    // sample-accurate beat sync. Master compressor glues the mix.

    class BackingTrackEngine {
      constructor(tempo = DEFAULT_TEMPO, totalBeats = TOTAL_BEATS) {
        this.tempo = tempo;
        this.totalBeats = totalBeats;
        this.ctx = null;
        this._isPlaying = false;
        this._timeouts = [];
        this._noiseBuffer = null;

        // Arrangement data
        this._bassPattern = [];   // Hz per beat (24 beats = 3 loops)
        this._leadPattern = [];   // Hz per beat
        this._mood = 'happy';
      }

      /**
       * Analyse the grid and design the arrangement.
       */
      generate(density, activeCount, grid) {
        // Choose mood from grid analysis
        let mood = 'happy';
        if (density > 0.4 && activeCount >= 4) mood = 'energetic';
        else if (density < 0.15) mood = 'calm';
        this._mood = mood;

        // ── Bass pattern (3 loops × 8 beats) ──
        // Chord roots: C2→F2→G2→C2 (I-IV-V-I in C major)
        const roots = {
          happy:     [65.41, 87.31, 98.00, 65.41],  // C2 F2 G2 C2
          energetic: [65.41, 98.00, 110.00, 87.31], // C2 G2 A2 F2
          calm:      [110.00, 146.83, 130.81, 110.00], // A2 D3 C3 A2
        };
        const rootSet = roots[mood];
        this._bassPattern = [];
        for (let loop = 0; loop < 3; loop++) {
          for (let b = 0; b < this.totalBeats; b++) {
            const chordIdx = Math.floor(b / 2) % rootSet.length;
            this._bassPattern.push(rootSet[chordIdx]);
          }
        }

        // ── Lead pattern — simple pentatonic phrase ──
        const scales = {
          happy:     [523.25, 587.33, 659.25, 783.99, 880.00], // C5 D5 E5 G5 A5
          energetic: [523.25, 659.25, 783.99, 880.00, 1046.50],
          calm:      [440.00, 523.25, 587.33, 659.25, 783.99],
        };
        const scale = scales[mood];
        const phrase = [0, 1, 2, 3, 4, 3, 2, 0]; // ascending → descending
        this._leadPattern = [];
        for (let loop = 0; loop < 3; loop++) {
          for (let b = 0; b < this.totalBeats; b++) {
            const idx = phrase[b % phrase.length];
            this._leadPattern.push(scale[Math.min(idx, scale.length - 1)]);
          }
        }

        return { mood, totalBeats: this.totalBeats * 3 };
      }

      /**
       * Play the full arrangement.
       * Decodes user blobs, schedules all layers, calls onBeat/onComplete.
       */
      async play(sounds, grid, onBeat, onComplete) {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
          if (onComplete) setTimeout(onComplete, 300);
          return;
        }
        if (this.ctx.state === 'suspended') await this.ctx.resume();
        this._isPlaying = true;

        const beatSec = 60 / this.tempo;
        const startTime = this.ctx.currentTime + 0.2;
        const totalLoops = 3;
        const totalBeats = this.totalBeats * totalLoops;

        // ── Pre-decode user sounds into AudioBuffers ──
        const decodedBuffers = await Promise.all((sounds || []).map(async (s) => {
          if (s && s.blob && !s.fallback) {
            try {
              const ab = await s.blob.arrayBuffer();
              return await this.ctx.decodeAudioData(ab);
            } catch (e) {
              return null;
            }
          }
          return null;
        }));

        // ── Shared noise buffer for snare / hi-hat ──
        this._noiseBuffer = this._createNoiseBuffer(0.3);

        // ── Master chain with compressor ──
        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.value = -22;
        compressor.knee.value = 30;
        compressor.ratio.value = 12;
        compressor.attack.value = 0.003;
        compressor.release.value = 0.25;

        const masterGain = this.ctx.createGain();
        masterGain.gain.value = 0.8;
        compressor.connect(masterGain);
        masterGain.connect(this.ctx.destination);

        // ── Schedule every beat ──
        for (let beat = 0; beat < totalBeats; beat++) {
          const time = startTime + beat * beatSec;
          const gridBeat = beat % this.totalBeats;

          // 1. Kick on strong beats (0, 2, 4, 6 in each 8-beat cycle)
          if (gridBeat % 2 === 0) {
            this._scheduleKick(time, compressor);
          }

          // 2. Snare on backbeats (1, 3, 5, 7)
          if (gridBeat % 2 === 1) {
            this._scheduleSnare(time, compressor);
          }

          // 3. Hi-hat — 8th-note shuffle
          this._scheduleHihat(time, compressor);           // on-beat
          this._scheduleHihat(time + beatSec * 0.5, compressor); // off-beat

          // 4. Bass line
          if (this._bassPattern[beat]) {
            this._scheduleBassNote(time, this._bassPattern[beat], beatSec * 0.85, compressor);
          }

          // 5. User's own sounds stacked on top (direct to destination, no compressor squashing)
          if (decodedBuffers && grid) {
            for (let s = 0; s < decodedBuffers.length; s++) {
              if (grid[s] && grid[s][gridBeat]) {
                if (decodedBuffers[s]) {
                  // Real recording — play at full volume, direct to destination (bypass compressor)
                  this._scheduleUserSound(time, decodedBuffers[s], this.ctx.destination);
                } else {
                  // Fallback / silent sound — play a gentle beep instead
                  this._scheduleFallbackBeep(time, s, beatSec * 0.3, compressor);
                }
              }
            }
          }

          // 6. Lead melody (only in the last loop, full volume)
          if (beat >= totalBeats - this.totalBeats) {
            const leadFreq = this._leadPattern[beat];
            if (leadFreq) {
              this._scheduleLeadNote(time, leadFreq, beatSec * 0.55, compressor);
            }
          }

          // Beat-highlight callback (for visual sync)
          const delayMs = (time - this.ctx.currentTime) * 1000;
          if (delayMs > 0) {
            const tid = setTimeout(() => {
              if (this._isPlaying && onBeat) onBeat(gridBeat);
            }, delayMs);
            this._timeouts.push(tid);
          }
        }

        // ── Schedule completion ──
        const totalDuration = totalBeats * beatSec + 1.5;
        setTimeout(() => {
          if (this._isPlaying) {
            this._isPlaying = false;
            this._cleanup();
            if (onComplete) onComplete();
          }
        }, totalDuration * 1000);
      }

      stop() {
        this._isPlaying = false;
        this._cleanup();
      }

      // ── Internal helpers ──

      _cleanup() {
        this._timeouts.forEach(t => clearTimeout(t));
        this._timeouts = [];
        if (this.ctx) {
          try { this.ctx.close(); } catch(e) {}
          this.ctx = null;
        }
      }

      _createNoiseBuffer(durationSec) {
        const len = this.ctx.sampleRate * durationSec;
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        return buf;
      }

      // ── Drum synthesis (inspired by sen-ltd/drum-machine and Sound on Sound) ──

      _scheduleKick(time, dest) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        // Pitch sweep: high click → low thud
        osc.frequency.setValueAtTime(160, time);
        osc.frequency.exponentialRampToValueAtTime(42, time + 0.06);
        // Amplitude: instant attack, long decay
        gain.gain.setValueAtTime(0.85, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.38);
        osc.connect(gain);
        gain.connect(dest);
        osc.start(time);
        osc.stop(time + 0.4);
      }

      _scheduleSnare(time, dest) {
        // Body: triangle tone (rim hit)
        const body = this.ctx.createOscillator();
        const bodyGain = this.ctx.createGain();
        body.type = 'triangle';
        body.frequency.setValueAtTime(210, time);
        body.frequency.exponentialRampToValueAtTime(110, time + 0.04);
        bodyGain.gain.setValueAtTime(0.5, time);
        bodyGain.gain.exponentialRampToValueAtTime(0.001, time + 0.055);
        body.connect(bodyGain);
        bodyGain.connect(dest);
        body.start(time);
        body.stop(time + 0.07);

        // Noise burst: white noise → bandpass at 1.5kHz (the rattle)
        const noise = this.ctx.createBufferSource();
        noise.buffer = this._noiseBuffer;
        const nf = this.ctx.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.value = 1500;
        nf.Q.value = 0.6;
        const ng = this.ctx.createGain();
        ng.gain.setValueAtTime(0.55, time);
        ng.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
        noise.connect(nf);
        nf.connect(ng);
        ng.connect(dest);
        noise.start(time);
        noise.stop(time + 0.18);
      }

      _scheduleHihat(time, dest) {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = 'square';           // square → rich odd harmonics → metallic
        osc.frequency.setValueAtTime(7800, time);
        filter.type = 'bandpass';
        filter.frequency.value = 7500; // 7-8 kHz is where cymbals live
        filter.Q.value = 12;           // narrow band → ringing
        gain.gain.setValueAtTime(0.13, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(dest);
        osc.start(time);
        osc.stop(time + 0.05);
      }

      _scheduleBassNote(time, freq, duration, dest) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);
        // Subtle pitch bend for punch
        osc.frequency.linearRampToValueAtTime(freq * 0.97, time + 0.04);
        gain.gain.setValueAtTime(0.75, time);
        gain.gain.linearRampToValueAtTime(0.55, time + duration * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.connect(gain);
        gain.connect(dest);
        osc.start(time);
        osc.stop(time + duration + 0.05);
      }

      _scheduleUserSound(time, buffer, dest) {
        // Play the user's recording at full volume, directly on top of the mix
        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(1.0, time);
        gain.gain.linearRampToValueAtTime(0.8, time + Math.min(buffer.duration * 0.6, 0.5));
        gain.gain.exponentialRampToValueAtTime(0.001, time + buffer.duration);
        source.connect(gain);
        gain.connect(dest);
        source.start(time);
        source.stop(time + buffer.duration);
      }

      _scheduleFallbackBeep(time, soundIndex, duration, dest) {
        // Play a gentle beep when no real recording exists (mic denied)
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300 + soundIndex * 80, time);
        gain.gain.setValueAtTime(0.25, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.connect(gain);
        gain.connect(dest);
        osc.start(time);
        osc.stop(time + duration + 0.03);
      }

      _scheduleLeadNote(time, freq, duration, dest) {
        // Twin detuned oscillators → warm, bell-like tone
        const o1 = this.ctx.createOscillator();
        const o2 = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o1.type = 'triangle';
        o1.frequency.value = freq;
        o1.detune.value = -2.5;
        o2.type = 'sine';
        o2.frequency.value = freq * 2; // one octave up for sparkle
        o2.detune.value = 3;
        g.gain.setValueAtTime(0.45, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + duration);
        o1.connect(g);
        o2.connect(g);
        g.connect(dest);
        o1.start(time);
        o2.start(time);
        o1.stop(time + duration + 0.03);
        o2.stop(time + duration + 0.03);
      }
    }

    // ===================================================================
    // AUDIO CONTEXT WARMUP
    // ===================================================================
    let audioContextWarmed = false;
    function warmupAudio() {
      if (audioContextWarmed) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(0.01);
        audioContextWarmed = true;
        setTimeout(() => ctx.close().catch(()=>{}), 100);
      } catch(e) {}
    }

    // ===================================================================
    // TTS
    // ===================================================================
    function speakText(text, onEnd) {
      if (!text) { if (onEnd) onEnd(); return; }
      const settings = typeof GameSettings !== 'undefined' ? GameSettings.getAll() : {};
      if (settings.mute && !onEnd) return;

      window.speechSynthesis.cancel();

      const settingsRate = settings.speechRate || 0.85;
      const settingsVolume = settings.mute ? 0 : ((settings.volume || 90) / 100);
      const settingsVoiceURI = settings.voiceURI || '';

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = settingsRate;
      utterance.pitch = 1.1;
      utterance.volume = settingsVolume;
      utterance.lang = 'en-US';

      if (settingsVoiceURI) {
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(x => x.voiceURI === settingsVoiceURI);
        if (v) utterance.voice = v;
      }

      if (onEnd) utterance.onend = onEnd;
      utterance.onerror = () => { if (onEnd) onEnd(); };

      // Update state indicator
      updateAIState('speaking', 'Speaking');
      utterance.onstart = () => {
        updateAIState('speaking', 'Speaking');
      };

      window.speechSynthesis.speak(utterance);
    }

    // ===================================================================
    // AI STATE INDICATOR
    // ===================================================================
    function updateAIState(dotClass, label) {
      stateDot.className = 'state-dot ' + dotClass;
      stateLabel.textContent = label || '';
    }

    // ===================================================================
    // SPEECH BUBBLE
    // ===================================================================
    function setSpeechText(text) {
      speechText.textContent = text || '';
    }

    // ===================================================================
    // ROBOT EXPRESSION
    // ===================================================================
    function setRobotExpression(expr) {
      const pupils = document.querySelectorAll('.robot-pupil');
      const mouth = document.getElementById('robot-mouth');
      pupils.forEach(p => {
        p.classList.remove('happy', 'amazed');
        if (expr === 'happy') p.classList.add('happy');
        else if (expr === 'amazed') p.classList.add('amazed');
      });
      if (expr === 'happy') {
        mouth.setAttribute('d', 'M28,36 Q35,46 42,36');
      } else if (expr === 'amazed') {
        mouth.setAttribute('d', 'M25,35 Q35,40 45,35');
      } else {
        mouth.setAttribute('d', 'M28,38 Q35,44 42,38');
      }
    }

    // ===================================================================
    // AI SPEAK + TEXT BUBBLE
    // ===================================================================
    function aiSay(text, onEnd, expression) {
      setSpeechText(text);
      if (expression) setRobotExpression(expression);
      speakText(text, () => {
        setRobotExpression('neutral');
        if (onEnd) onEnd();
      });
      // Add to transcript
      if (typeof GameTranscript !== 'undefined') {
        GameTranscript.add('ai', text);
      }
    }

    // ===================================================================
    // SOUND BANK UI HELPERS
    // ===================================================================
    function getSoundColor(index) {
      return SOUND_COLORS[index] || '#CCC';
    }

    function getSoundColorHex(index) {
      return SOUND_COLOR_HEX[index] || '#CCCCCC';
    }

    function getSoundAbbr(name) {
      if (!name) return '?';
      return name.substring(0, 3).toUpperCase();
    }

    // ===================================================================
    // STATE MACHINE
    // ===================================================================
    let currentState = 'init';
    let recorder = new SoundRecorder();
    let backingTrack = null;
    let sequencerInterval = null;

    function transitionTo(newState) {
      if (state.isTransitioning && newState !== 'init') return;
      state.isTransitioning = true;
      clearIdleTimer();
      currentState = newState;
      state.currentState = newState;
      // Hide settings modal if transitioning
      if (typeof GameSettings !== 'undefined') GameSettings.hide();
      if (typeof GameTranscript !== 'undefined') GameTranscript.hide();
      // Stop any active recording
      if (recorder) recorder.isActive = false;
      // Stop any sequencer playback
      stopSequencer();
      // Render
      render();
      state.isTransitioning = false;
    }

    // Expose for testing/automation
    window.__gameTest = {
      transitionTo,
      getState: () => currentState,
      state,
      TOTAL_SOUNDS,
      TOTAL_BEATS,
      initGrid,
      autoFillGrid,
      speakText,
      setSpeechText,
      launchConfetti
    };

    // ===================================================================
    // RENDER DISPATCH
    // ===================================================================
    function render() {
      switch (currentState) {
        case 'init': renderInit(); break;
        case 'mic_check': renderMicCheck(); break;
        case 'record': renderRecord(); break;
        case 'playback': renderPlayback(); break;
        case 'name_sound': renderNameSound(); break;
        case 'sound_bank_complete': renderSoundBankComplete(); break;
        case 'sequencer_intro': renderSequencerIntro(); break;
        case 'sequencer_edit': renderSequencerEdit(); break;
        case 'sequencer_play': renderSequencerPlay(); break;
        case 'lock_song': renderLockSong(); break;
        case 'ai_composing': renderAIComposing(); break;
        case 'ai_playing': renderAIPlaying(); break;
        case 'celebration': renderCelebration(); break;
        default: renderInit(); break;
      }
    }

    // SCREEN RENDERERS
    // ===================================================================

    // ---- RECORD ----
    function renderRecord() {
      const idx = state.soundIndex;
      const prompt = RECORD_PROMPTS[idx] || 'Make a sound!';
      const soundNum = idx + 1;

      // Build sound bank dots
      let bankHTML = '';
      for (let i = 0; i < TOTAL_SOUNDS; i++) {
        if (i < state.sounds.length) {
          const s = state.sounds[i];
          bankHTML += `<span class="sound-icon" style="background:${s.color}">
            <span class="sound-abbr">${getSoundAbbr(s.name)}</span>
            <span class="sound-check">&#10003;</span>
          </span>`;
        } else if (i === idx) {
          bankHTML += `<span class="sound-icon" style="background:${getSoundColor(idx)};animation:popIn 300ms">
            <span class="sound-abbr">${soundNum}</span>
          </span>`;
        } else {
          bankHTML += `<span class="sound-icon future">
            <span class="sound-abbr">${i + 1}</span>
          </span>`;
        }
      }

      main.innerHTML = `
        <div class="screen text-center">
          <p class="text-large mb-sm">Sound #${soundNum}</p>
          <p class="text-small mb-md">${prompt}</p>
          <div class="recording-ring-container">
            <svg class="recording-ring" viewBox="0 0 120 120">
              <circle class="bg-circle" cx="60" cy="60" r="54"/>
              <circle class="progress-circle" id="rec-progress" cx="60" cy="60" r="54"
                stroke-dasharray="339.292" stroke-dashoffset="339.292"/>
            </svg>
            <button class="mic-btn" id="btn-record" aria-label="Record sound number ${soundNum}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="text-small mt-sm" id="record-status">Tap the mic to start!</p>
          <div class="sound-bank mt-lg">${bankHTML}</div>
        </div>
      `;

      setSpeechText(prompt);
      updateAIState('listening', 'Listening');
      headerTitle.textContent = `Recording Sound ${soundNum}`;

      const micBtn = document.getElementById('btn-record');
      const progressCircle = document.getElementById('rec-progress');
      const statusEl = document.getElementById('record-status');
      let recordingActive = false;

      function startRecordingSession() {
        if (recordingActive) return;
        recordingActive = true;
        state.isRecording = true;

        micBtn.classList.add('recording');
        statusEl.textContent = 'Recording...';
        updateAIState('thinking', 'Recording');

        if (state.useOscillatorFallback) {
          // Fallback mode: simulate recording with a beep
          let p = 0;
          const interval = setInterval(() => {
            p += 0.05;
            if (progressCircle) {
              const offset = 339.292 * (1 - Math.min(1, p));
              progressCircle.style.strokeDashoffset = offset;
            }
            if (p >= 1) {
              clearInterval(interval);
              finishFallback();
            }
          }, 150);
          recorder._fallbackInterval = interval;
        } else {
          recorder.onTick = (progress) => {
            if (progressCircle) {
              const offset = 339.292 * (1 - Math.min(1, progress));
              progressCircle.style.strokeDashoffset = offset;
            }
          };
          recorder.onComplete = (blob) => {
            recordingActive = false;
            state.isRecording = false;
            micBtn.classList.remove('recording');
            // Silence detection: check blob size & content
            const isSilent = !blob || blob.size < 1000;
            if (blob && !isSilent) {
              state.recordingRetries = 0; // Reset on success
              state.recordingBlob = blob;
              transitionTo('playback');
            } else if (state.recordingRetries < 3) {
              state.recordingRetries++;
              statusEl.textContent = 'I didn\'t hear anything! Try again — make a loud sound!';
              recordingActive = false;
            } else {
              // Accept silent sound after 3 retries
              state.recordingRetries = 0;
              statusEl.textContent = 'That\'s okay! A very quiet sound!';
              if (blob) {
                state.recordingBlob = blob;
              } else {
                state.recordingBlob = null;
                state._fallbackSound = true;
              }
              setTimeout(() => transitionTo('playback'), 1500);
            }
          };
          recorder.startRecording(RECORD_DURATION);
        }
      }

      function finishFallback() {
        recordingActive = false;
        state.isRecording = false;
        if (recorder._fallbackInterval) {
          clearInterval(recorder._fallbackInterval);
          delete recorder._fallbackInterval;
        }
        micBtn.classList.remove('recording');
        // Generate a synthetic beep blob (simple approach: use oscillator)
        state.recordingBlob = null; // No real blob for fallback
        state._fallbackSound = true;
        transitionTo('playback');
      }

      micBtn.addEventListener('click', startRecordingSession);

      // Idle timer: prompt after 10s, auto-advance after 3 prompts
      var recordIdleFn = function() {
        if (currentState === 'record' && !recordingActive) {
          if (state.idlePromptCount < 3) {
            aiSay('Tap the round button and make a sound!', null, 'neutral');
            state.idlePromptCount++;
            // Restart idle timer for next check
            startIdleTimer(10000, recordIdleFn);
          } else {
            // Auto-advance with fallback after 30s idle
            state.idlePromptCount = 0;
            state.recordingBlob = null;
            state._fallbackSound = true;
            transitionTo('playback');
          }
        }
      };
      startIdleTimer(10000, recordIdleFn);
    }

            osc.type = 'sine';

    // ---- NAME SOUND ----
    function renderNameSound() {
      const idx = state.soundIndex;
