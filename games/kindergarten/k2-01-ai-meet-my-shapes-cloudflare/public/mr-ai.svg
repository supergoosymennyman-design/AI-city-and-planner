<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520">
  <defs>
    <linearGradient id="grad-casing-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4C8B5" />
      <stop offset="100%" stop-color="#B8A992" />
    </linearGradient>
    <linearGradient id="grad-casing-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAE1D5" />
      <stop offset="100%" stop-color="#C9BBA8" />
    </linearGradient>
    <linearGradient id="grad-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97743" />
      <stop offset="50%" stop-color="#A6522E" />
      <stop offset="100%" stop-color="#73321A" />
    </linearGradient>
    <linearGradient id="grad-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88929E" />
      <stop offset="100%" stop-color="#555E68" />
    </linearGradient>
    <linearGradient id="grad-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#0A0F18" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-shadow">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <g id="legs">
      <rect x="180" y="380" width="30" height="70" rx="8" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
      <path d="M 160 450 L 220 450 A 10 10 0 0 1 220 470 L 160 470 A 10 10 0 0 1 160 450 Z" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="3"/>
      <rect x="250" y="380" width="30" height="70" rx="8" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
      <path d="M 240 450 L 300 450 A 10 10 0 0 1 300 470 L 240 470 A 10 10 0 0 1 240 450 Z" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="3"/>
      <path d="M 170 340 L 290 340 L 270 390 L 190 390 Z" fill="url(#grad-casing-dark)" stroke="#594F40" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="230" cy="365" r="10" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="2"/>
    </g>

    <g id="backpack">
      <rect x="310" y="210" width="40" height="120" rx="10" fill="url(#grad-casing-light)" stroke="#594F40" stroke-width="4"/>
      <rect x="315" y="230" width="10" height="80" rx="5" fill="#3D1A0D" opacity="0.3"/>
      <rect x="325" y="200" width="40" height="10" fill="#2161A8" transform="skewX(30)" stroke="#141E30" stroke-width="2"/>
    </g>

    <g id="torso">
      <rect x="210" y="180" width="40" height="40" rx="10" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
      <rect x="150" y="210" width="160" height="140" rx="20" fill="url(#grad-casing-light)" stroke="#594F40" stroke-width="5"/>
      <rect x="140" y="230" width="20" height="100" rx="5" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="3"/>
      <rect x="300" y="230" width="20" height="100" rx="5" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="3"/>
      <rect x="190" y="240" width="80" height="60" rx="10" fill="url(#grad-casing-dark)" stroke="#8C7D66" stroke-width="3"/>
      <rect x="200" y="250" width="60" height="40" rx="5" fill="#0D2E26" filter="url(#inner-shadow)"/>
      <g filter="url(#glow-green)">
        <line x1="210" y1="270" x2="230" y2="270" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <line x1="235" y1="270" x2="250" y2="270" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <circle cx="215" cy="260" r="3" fill="#10B981"/>
      </g>
      <path d="M 230 310 L 250 310 L 255 320 L 225 320 Z" fill="#2161A8" stroke="#141E30" stroke-width="2"/>
      <text x="240" y="318" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FDFBF7" text-anchor="middle">STOSENT</text>
    </g>

    <g id="arm-left">
      <circle cx="140" cy="240" r="25" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="4"/>
      <circle cx="140" cy="240" r="10" fill="url(#grad-steel)"/>
      <rect x="90" y="230" width="50" height="20" rx="10" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
      <circle cx="90" cy="240" r="15" fill="url(#grad-casing-dark)" stroke="#594F40" stroke-width="3"/>
      <g transform="rotate(45, 90, 240)">
        <rect x="90" y="230" width="60" height="20" rx="10" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
        <path d="M 150 225 L 170 225 L 170 235 L 150 235 Z" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="2"/>
        <path d="M 150 245 L 170 245 L 170 255 L 150 255 Z" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="2"/>
      </g>
    </g>

    <g id="book">
      <path d="M 110 320 Q 150 310 190 320 Q 230 310 270 320 L 260 340 Q 220 330 180 340 Q 140 330 100 340 Z" fill="#FDFBF7" stroke="#A8A294" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 110 325 Q 150 315 190 325 Q 230 315 270 325 L 260 345 Q 220 335 180 345 Q 140 335 100 345 Z" fill="#2161A8" stroke="#141E30" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 190 320 L 180 340" stroke="#141E30" stroke-width="3"/>
      <circle cx="150" cy="325" r="4" fill="#D97743"/>
      <circle cx="130" cy="330" r="2" fill="#555E68"/>
      <path d="M 210 325 L 240 325" stroke="#555E68" stroke-width="2" stroke-linecap="round"/>
      <path d="M 210 332 L 230 332" stroke="#555E68" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g id="arm-right">
      <circle cx="320" cy="240" r="25" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="4"/>
      <circle cx="320" cy="240" r="10" fill="url(#grad-steel)"/>
      <rect x="320" y="230" width="50" height="20" rx="10" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
      <circle cx="370" cy="240" r="15" fill="url(#grad-casing-dark)" stroke="#594F40" stroke-width="3"/>
      <g transform="rotate(-60, 370, 240)">
        <rect x="370" y="230" width="60" height="20" rx="10" fill="url(#grad-steel)" stroke="#2C3238" stroke-width="3"/>
        <rect x="430" y="225" width="20" height="30" rx="5" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="3"/>
      </g>
    </g>

    <g id="pencil" transform="translate(230, 260) rotate(15)">
      <rect x="0" y="0" width="60" height="8" rx="2" fill="#F5B041" stroke="#A16207" stroke-width="1.5"/>
      <rect x="45" y="0" width="8" height="8" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
      <path d="M 53 0 L 58 0 A 4 4 0 0 1 62 4 L 62 4 A 4 4 0 0 1 58 8 L 53 8 Z" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1.5"/>
      <polygon points="0,0 -15,4 0,8" fill="#FDE047" stroke="#A16207" stroke-width="1.5"/>
      <polygon points="-10,2.5 -15,4 -10,5.5" fill="#334155"/>
    </g>

    <g id="head" transform="rotate(-5, 230, 130)">
      <rect x="110" y="40" width="220" height="150" rx="30" fill="url(#grad-casing-light)" stroke="#594F40" stroke-width="6"/>
      <path d="M 130 50 Q 140 60 135 70" fill="none" stroke="#D97743" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M 310 50 Q 300 60 305 75" fill="none" stroke="#D97743" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <path d="M 120 160 Q 130 150 140 165" fill="none" stroke="#D97743" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M 140 40 L 120 -10" stroke="url(#grad-steel)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="-10" r="5" fill="#D97743"/>
      <path d="M 280 40 L 290 0" stroke="url(#grad-steel)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="290" cy="0" r="5" fill="#D97743"/>
      <circle cx="330" cy="115" r="25" fill="url(#grad-copper)" stroke="#3D1A0D" stroke-width="4"/>
      <circle cx="330" cy="115" r="15" fill="url(#grad-steel)"/>
      <line x1="330" y1="100" x2="330" y2="130" stroke="#2C3238" stroke-width="3"/>
      <line x1="315" y1="115" x2="345" y2="115" stroke="#2C3238" stroke-width="3"/>
      <rect x="130" y="60" width="180" height="110" rx="20" fill="url(#grad-casing-dark)" stroke="#594F40" stroke-width="4"/>
      <rect x="140" y="70" width="160" height="90" rx="15" fill="url(#grad-screen)" filter="url(#inner-shadow)"/>
      <g filter="url(#glow-cyan)">
        <path d="M 160 100 Q 175 80 190 100" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
        <path d="M 210 100 Q 225 80 240 100" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
        <path d="M 180 120 Q 200 135 220 120" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
        <path d="M 145 80 A 80 80 0 0 1 170 73" fill="none" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </g>
    </g>
  </g>
</svg>
