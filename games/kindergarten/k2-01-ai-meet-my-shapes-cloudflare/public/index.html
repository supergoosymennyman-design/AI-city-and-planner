<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>K2-01 AI Meet My Shapes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100dvh;font-family:system-ui,sans-serif;font-size:20px;color:#333;background:#FFF8E7;overflow-x:hidden}
#app{width:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;text-align:center;position:relative}
.mr-ai-svg{width:160px;display:block;margin:0 auto}
.mr-ai-svg svg{width:100%;height:auto}
.speech-bubble,.ai-bubble{background:#fff;border:3px solid #A78BFA;border-radius:20px;padding:14px 20px;font-size:1rem;max-width:440px;line-height:1.4}
.btn-begin{background:#FFD93D;border:none;border-radius:28px;padding:16px 44px;font-size:1.3rem;font-weight:700;color:#333;cursor:pointer;box-shadow:0 4px 16px rgba(255,217,61,.4);min-height:60px;font-family:inherit;touch-action:manipulation}
.btn-begin:active{transform:scale(.96)}.btn-begin.sec{background:#E8F8F7;box-shadow:none}
.btn-begin.small{padding:10px 24px;font-size:1rem;min-height:44px}
.canvas-wrap{width:60vw;max-width:400px;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:3px solid #A78BFA;background:#fff;position:relative;margin:0 auto}
.canvas-wrap.smart{width:40vw;max-width:280px}
.canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none}
.toolbar{display:flex;gap:6px;justify-content:center;align-items:center;max-width:400px;flex-wrap:wrap}
.tool-btn{width:36px;height:36px;border-radius:50%;border:2px solid #ddd;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:#fff;touch-action:manipulation}
.progress-bars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:440px}
.progress-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;width:75px}
.progress-bar{width:100%;height:8px;background:#ddd;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#A78BFA,#7C3AED);border-radius:4px;width:0%;transition:width .4s ease}
.progress-fill.done{background:#86EFAC}
.state-label{font-size:.9rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em}
.prompt{font-size:.9rem;color:#555}.mic-status{font-size:.85rem;color:#A78BFA;font-weight:600}
.transcript{background:#f0fdf4;border:2px solid #86EFAC;border-radius:10px;padding:5px 12px;font-size:.75rem;color:#555;max-width:380px;min-height:22px;text-align:center}
#mic-btn{position:fixed;top:8px;right:8px;width:48px;height:48px;border:3px solid #fff;border-radius:50%;font-size:22px;cursor:pointer;z-index:10001;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.3);outline:none}
#mic-btn.on{background:#86EFAC;border-color:#4ADE80}#mic-btn.off{background:#FCA5A5;border-color:#F87171}
#mic-btn.off::after{content:"/";position:absolute;font-size:30px;color:#DC2626;font-weight:900;transform:rotate(-20deg);opacity:.8}
.canvas-area{background:#1a1a2e;border-radius:16px;border:3px solid #A78BFA;width:100%;max-width:440px;position:relative}
.canvas-area canvas{width:100%;display:block;aspect-ratio:4/3}
.canvas-area svg{width:100%;display:block;aspect-ratio:4/3}
#creation-svg-container{width:100%;aspect-ratio:4/3;display:none}
#creation-svg-container svg{width:100%;height:100%;display:block}
.gallery{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:440px}
.gallery-item{background:#fff;border:2px solid #ddd;border-radius:8px;padding:4px;width:65px;height:65px;overflow:hidden;font-size:.6rem;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888}
.gallery-row{display:flex;gap:6px;padding:4px 0;max-width:440px;overflow-x:auto;justify-content:flex-start;margin:0 auto}
.gallery-row .thumb{flex-shrink:0;width:60px;cursor:pointer;border:2px solid #ddd;border-radius:6px;overflow:hidden;text-align:center;background:#fff;transition:border-color .2s}
.gallery-row .thumb:hover{border-color:#A78BFA}
.gallery-row .thumb canvas{width:100%;height:auto;display:block}
.gallery-row .thumb .thumb-label{font-size:.5rem;color:#888;padding:1px 0}
#svg-viewer{animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.celebration-screen{position:relative}
#cc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.btn-row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}
#dev-panel{position:fixed;bottom:0;left:0;right:0;max-height:80px;background:rgba(0,0,0,.85);color:#ccc;font-family:monospace;font-size:10px;overflow-y:auto;padding:4px 8px;z-index:9999;border-top:2px solid #A78BFA}
#dev-panel .title{color:#A78BFA;font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:2px}
#dev-panel .line{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03);line-height:1.3}
#dev-panel .t{color:#888;margin-right:4px}
@media(max-width:768px){body{font-size:18px}.canvas-wrap{width:70vw}.speech-bubble{font-size:1rem;padding:12px 18px}.mr-ai-svg{width:120px}.progress-item{width:68px}}
@media(max-width:480px){body{font-size:16px}.canvas-wrap{width:80vw}.canvas-wrap.smart{width:55vw}.btn-begin{font-size:1.1rem;padding:14px 32px}.btn-row{flex-direction:column;gap:8px}.progress-bars{gap:5px}.progress-item{width:55px}}
</style>
</head>
<body>
<div id="app"></div>
<!-- DEV PANEL - comment out for production
<div id="dev-panel"><div class="title">DEV TRANSCRIPT</div><div id="dev-transcript"></div></div>
-->
<script src="conversation.js?v=4"></script>
<script src="vision.js?v=4"></script>
<script src="creation.js?v=4"></script>
<script src="game-state.js?v=4"></script>
</body>
</html>
