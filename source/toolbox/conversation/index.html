<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Local High-Speed Real-time Voice Chat</title>
        <style>
            :root {
                --bg-color: #0f172a;
                --panel-color: #1e293b;
                --accent-color: #6366f1;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
            }
            body {
                background-color: var(--bg-color);
                color: var(--text-main);
                font-family: system-ui, sans-serif;
                margin: 0;
                padding: 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .container {
                width: 100%;
                max-width: 640px;
                background: var(--panel-color);
                border-radius: 16px;
                padding: 24px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            }
            .status-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid #334155;
                padding-bottom: 12px;
                margin-bottom: 20px;
            }
            .indicator {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background-color: #64748b;
                display: inline-block;
                margin-right: 8px;
            }
            .indicator.active {
                background-color: #22c55e;
                animation: pulse 1.5s infinite;
            }
            .indicator.loading {
                background-color: #eab308;
            }
            .indicator.interrupted {
                background-color: #ef4444;
            }
            .display-box {
                background: #0f172a;
                border-radius: 8px;
                padding: 16px;
                min-height: 80px;
                margin-bottom: 16px;
            }
            .label {
                font-size: 0.75rem;
                text-transform: uppercase;
                color: var(--text-muted);
                margin-bottom: 6px;
                font-weight: 700;
            }
            .text-content {
                font-size: 1.1rem;
                line-height: 1.5;
            }
            select,
            button {
                width: 100%;
                background: var(--accent-color);
                color: white;
                border: none;
                padding: 14px;
                font-size: 1rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
                margin-bottom: 12px;
            }
            select {
                background: #334155;
                color: white;
                border: 1px solid #475569;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            @keyframes pulse {
                0% {
                    transform: scale(0.95);
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
                }
                70% {
                    transform: scale(1);
                    box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
                }
                100% {
                    transform: scale(0.95);
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="status-bar">
                <div>
                    Status:
                    <span id="status-text">Select a model and click start</span>
                </div>
                <div><span id="status-indicator" class="indicator"></span></div>
            </div>

            <div style="margin-bottom: 16px">
                <div class="label">Target LLM Model</div>
                <select id="model-select">
                    <option value="Qwen3-0.6B-q4f16_1-MLC">
                        Qwen3 0.6B (High Performance)
                    </option>
                    <option value="Qwen3.5-0.8B-q4f16_1-MLC">
                        Qwen3.5 0.8B (Latest)
                    </option>
                    <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">
                        SmolLM2 360M Instruct
                    </option>
                    <option value="gemma3-1b-it-q4f16_1-MLC">
                        Gemma 3 1B (Google)
                    </option>
                </select>
            </div>

            <div class="display-box">
                <div class="label">You (Live Transcription)</div>
                <div
                    id="user-speech-box"
                    class="text-content"
                    style="color: #38bdf8"
                >
                    ...
                </div>
            </div>

            <div class="display-box">
                <div class="label">AI Response</div>
                <div
                    id="ai-speech-box"
                    class="text-content"
                    style="color: #34d399"
                >
                    ...
                </div>
            </div>

            <button id="start-btn">Start Voice Session</button>
        </div>

        <script type="module">
            import { VoiceAppCore } from "./VoiceAppCore.js";

            const startBtn = document.getElementById("start-btn");
            const modelSelect = document.getElementById("model-select");
            const statusText = document.getElementById("status-text");
            const statusIndicator = document.getElementById("status-indicator");
            const userSpeechBox = document.getElementById("user-speech-box");
            const aiSpeechBox = document.getElementById("ai-speech-box");

            let coreApp = null;

            startBtn.addEventListener("click", async () => {
                if (coreApp) {
                    await coreApp.terminate();
                }

                startBtn.disabled = true;
                modelSelect.disabled = true;

                coreApp = new VoiceAppCore({
                    modelId: modelSelect.value,
                    vadThreshold: 0.012,
                    eouSilenceDuration: 750,

                    onStateChange: ({ status, message }) => {
                        statusText.innerText = message;
                        statusIndicator.className =
                            "indicator " +
                            (status === "ready" ? "active" : status);
                    },

                    onTranscription: ({ text, isFinal }) => {
                        userSpeechBox.innerText = text;
                    },

                    onAiOutput: ({ delta, fullText }) => {
                        aiSpeechBox.innerText = fullText;
                    },
                });

                try {
                    await coreApp.initialize();
                    startBtn.innerText = "Listening System Active";
                } catch (e) {
                    statusText.innerText = "Failed: " + e.message;
                    statusIndicator.className = "indicator interrupted";
                    startBtn.disabled = false;
                    modelSelect.disabled = false;
                }
            });
        </script>
    </body>
</html>
