<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4a9e3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg">
  <title>Nature Hunt</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Loading screen -->
  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="load-text" id="load-text">🌿 Nature Hunt is loading...</div>
    <div class="load-sub" id="load-sub">Warming up the AI brain</div>
  </div>

  <!-- Know modal -->
  <div class="modal-overlay" id="know-modal">
    <div class="modal">
      <h2>📚 What I Know</h2>
      <ul class="item-list" id="know-list"></ul>
      <button class="close-btn" id="close-know">Close</button>
    </div>
  </div>

  <!-- App -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <span style="font-size:32px;">🌿</span>
        <h1>Nature Hunt</h1>
      </div>
      <span class="header-badge" id="header-badge">🌟 0 known</span>
    </header>

    <!-- Main content -->
    <div class="main-content">

      <!-- Camera panel -->
      <div class="camera-panel">
        <div class="camera-frame">
          <video id="camera-feed" autoplay playsinline style="display:none;"></video>
          <div class="placeholder" id="camera-placeholder">
            📷<br>Turn on the camera to start!
          </div>
          <div class="ai-overlay" id="ai-overlay" style="display:none;">👀 I am looking...</div>
        </div>

        <div class="learned-badges" id="learned-badges"></div>

        <div class="actions">
          <button class="btn btn-camera" id="btn-camera">📷 Camera On</button>
        </div>
      </div>

      <!-- AI panel -->
      <div class="ai-panel">
        <div class="speech-bubble" id="speech-bubble">
          <div class="ai-icon">🤖</div>
          <div class="speech-text" id="speech-text">Hello! Teach me about nature!</div>
          <div class="speech-sub" id="speech-sub"></div>
          <div class="listening-indicator">🎤 Listening...</div>
        </div>

        <div class="actions">
          <button class="btn btn-listen" id="btn-listen" disabled>🎤 Listen</button>
          <button class="btn btn-quiz" id="btn-quiz">🎯 Quiz Me</button>
          <button class="btn btn-know" id="btn-know">📚 Know</button>
          <button class="btn btn-forget" id="btn-forget">🗑️ Forget</button>
        </div>

        <div class="teach-input-area" id="teach-input-area">
          <input type="text" id="teach-input" placeholder="Type what you see...">
          <button class="btn btn-teach" id="btn-teach">Teach</button>
          <button class="btn btn-forget" id="btn-cancel-teach">Cancel</button>
        </div>

        <div class="quick-phrases" id="quick-phrases">
          <button class="btn btn-phrase" data-phrase="this is a flower">🌸 this is a flower</button>
          <button class="btn btn-phrase" data-phrase="this is a sun">☀️ this is a sun</button>
          <button class="btn btn-phrase" data-phrase="this is a cloud">☁️ this is a cloud</button>
          <button class="btn btn-phrase" data-phrase="this is a tree">🌳 this is a tree</button>
          <button class="btn btn-phrase" data-phrase="this is a bird">🐦 this is a bird</button>
          <button class="btn btn-phrase" data-phrase="what is this">❓ what is this</button>
          <button class="btn btn-phrase" data-phrase="what do you know">📚 what do you know</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="/storage.js"></script>
  <script src="/vision.js"></script>
  <script src="/speech.js"></script>
  <script src="/app.js"></script>
</body>
</html>
