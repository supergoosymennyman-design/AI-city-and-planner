<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>🔷 Lesson 2: Sorting Shapes – Robust Color Parsing</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Comic Sans MS", "Chalkboard SE", cursive;
                background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
                height: 100vh;
                overflow: hidden;
                padding: 10px;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 20px;
                padding: 15px;
                height: calc(100vh - 20px);
                display: flex;
                flex-direction: column;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
                border-radius: 12px;
                margin-bottom: 10px;
                flex-shrink: 0;
            }
            .header h1 {
                font-size: 1.5rem;
                color: white;
                margin: 0;
            }
            .btn-home {
                background: white;
                border: none;
                padding: 6px 12px;
                border-radius: 15px;
                cursor: pointer;
                font-weight: bold;
                color: #334155;
                transition: transform 0.2s;
            }
            .btn-home:hover {
                transform: scale(1.05);
            }

            .main-content {
                display: flex;
                gap: 15px;
                flex: 1;
                min-height: 0;
            }

            .left-column {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .mode-selector {
                display: flex;
                gap: 10px;
            }

            .mode-btn {
                flex: 1;
                padding: 10px;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                background: white;
                cursor: pointer;
                font-weight: bold;
                font-size: 0.9rem;
                transition: all 0.2s;
            }
            .mode-btn.active {
                background: #6366f1;
                color: white;
                border-color: #6366f1;
            }

            .bins-container {
                flex: 1;
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: center;
                background: #f8fafc;
                border-radius: 12px;
                padding: 10px;
                min-height: 160px;
                flex-wrap: wrap;
            }

            .bin {
                flex: 1;
                min-width: 80px;
                max-width: 140px;
                border: 3px dashed #cbd5e1;
                border-radius: 12px;
                padding: 15px 10px;
                text-align: center;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: white;
            }
            .bin:hover {
                border-style: solid;
                border-color: #6366f1;
                background: #e0e7ff;
            }
            .bin.selected {
                background: #dbeafe;
                border-color: #3b82f6;
                border-style: solid;
            }
            .bin-emoji {
                font-size: 2.5rem;
                margin-bottom: 5px;
            }
            .bin-label {
                font-weight: bold;
                color: #334155;
                font-size: 0.9rem;
            }

            .right-column {
                flex: 0.9;
                display: flex;
                flex-direction: column;
                gap: 10px;
                min-width: 0;
            }

            .object-preview {
                background: #fef3c7;
                border: 2px solid #fcd34d;
                border-radius: 12px;
                padding: 15px;
                text-align: center;
                flex-shrink: 0;
            }
            .object-emoji {
                font-size: 3rem;
                margin-bottom: 8px;
            }
            .object-label {
                font-size: 0.9rem;
                color: #92400e;
                font-weight: bold;
            }

            .rules-box {
                background: #f0fdf4;
                border: 2px solid #86efac;
                border-radius: 12px;
                padding: 10px;
                flex: 0 0 auto;
                max-height: 90px;
                overflow-y: auto;
            }
            .rules-box h3 {
                font-size: 0.9rem;
                color: #166534;
                margin-bottom: 6px;
            }
            .rule-item {
                background: white;
                padding: 4px 10px;
                border-radius: 8px;
                margin-bottom: 4px;
                font-size: 0.85rem;
                color: #166534;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .rule-item .delete-rule {
                cursor: pointer;
                color: #dc2626;
                font-weight: bold;
                font-size: 1rem;
                line-height: 1;
                padding: 0 2px;
                transition: transform 0.2s;
            }

            .voice-section {
                background: #fef3c7;
                border: 2px solid #fcd34d;
                border-radius: 12px;
                padding: 12px;
                flex-shrink: 0;
            }
            .voice-title {
                font-size: 0.85rem;
                color: #92400e;
                margin-bottom: 8px;
                text-align: center;
            }
            .voice-buttons {
                display: flex;
                gap: 10px;
                justify-content: center;
            }
            .voice-btn {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
                padding: 10px;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                font-weight: bold;
                transition: all 0.2s;
            }
            .voice-btn-teach {
                background: linear-gradient(135deg, #10b981 0%, #059669 100%);
                color: white;
            }
            .voice-btn-ask {
                background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                color: white;
            }
            .voice-btn.listening {
                animation: pulse 1s infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.05);
                }
            }
            .voice-icon {
                font-size: 1.8rem;
            }
            .voice-label {
                font-size: 0.8rem;
            }

            .camera-section {
                background: #f1f5f9;
                border: 2px solid #94a3b8;
                border-radius: 12px;
                padding: 10px;
                text-align: center;
                flex-shrink: 0;
            }
            video#cameraFeed {
                max-width: 100%;
                max-height: 150px;
                border-radius: 8px;
                background: #000;
                margin: 0 auto;
                display: block;
            }

            .conversation-box {
                background: #1e293b;
                border-radius: 12px;
                padding: 10px;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .conversation-scroll {
                flex: 1;
                overflow-y: auto;
                padding-right: 4px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .conv-entry {
                padding: 6px 10px;
                border-radius: 8px;
                font-size: 0.85rem;
                animation: fadeIn 0.3s ease;
            }
            .conv-entry.user {
                background: #1e293b;
                color: #fbbf24;
                border-left: 3px solid #fbbf24;
                align-self: flex-end;
                max-width: 90%;
            }
            .conv-entry.ai {
                background: #1e293b;
                color: #a5b4fc;
                border-left: 3px solid #818cf8;
                align-self: flex-start;
                max-width: 90%;
            }
            .conv-entry.system {
                background: #1e293b;
                color: #94a3b8;
                border-left: 3px solid #64748b;
                align-self: center;
                text-align: center;
                font-style: italic;
                max-width: 100%;
            }
            .conv-entry .speaker {
                font-weight: bold;
                font-size: 0.7rem;
                text-transform: uppercase;
                opacity: 0.7;
            }
            .conv-entry .timestamp {
                font-size: 0.6rem;
                opacity: 0.5;
                margin-left: 8px;
            }
            .conv-entry .transcript-note {
                font-size: 0.7rem;
                opacity: 0.6;
                font-style: italic;
                margin-top: 2px;
            }

            .status-bar {
                background: #f1f5f9;
                border-radius: 8px;
                padding: 8px;
                text-align: center;
                font-size: 0.85rem;
                color: #475569;
                min-height: 36px;
                flex-shrink: 0;
            }
            .status-bar.error {
                background: #fee2e2;
                color: #dc2626;
            }
            .status-bar.success {
                background: #dcfce7;
                color: #16a34a;
            }
            .status-bar.info {
                background: #dbeafe;
                color: #2563eb;
            }

            @media (max-width: 800px) {
                .main-content {
                    flex-direction: column;
                }
                .left-column {
                    flex: 0 0 45vh;
                }
                .right-column {
                    flex: 1;
                }
                .conversation-box {
                    min-height: 100px;
                }
                .bin {
                    min-width: 60px;
                    max-width: 100px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🔷 Sorting Shapes – Robust Color Parsing</h1>
                <button
                    class="btn-home"
                    onclick="window.location.href = 'index.html'"
                >
                    🏠 Home
                </button>
            </div>

            <div class="main-content">
                <div class="left-column">
                    <div class="mode-selector">
                        <button
                            class="mode-btn active"
                            onclick="app.setMode('color')"
                        >
                            🌈 Color Sort
                        </button>
                        <button class="mode-btn" onclick="app.setMode('size')">
                            📏 Size Sort
                        </button>
                    </div>
                    <div class="bins-container" id="binsContainer"></div>
                </div>

                <div class="right-column">
                    <div class="object-preview">
                        <div class="object-emoji" id="objectEmoji">❓</div>
                        <div class="object-label" id="objectLabel">
                            Show an object to the camera
                        </div>
                    </div>

                    <div class="rules-box">
                        <h3>📚 Colors I Know:</h3>
                        <div id="rulesList">
                            <em style="color: #94a3b8"
                                >No colors learned yet</em
                            >
                        </div>
                    </div>

                    <div class="voice-section">
                        <div class="voice-title">🎤 Use Your Voice</div>
                        <div class="voice-buttons">
                            <button
                                class="voice-btn voice-btn-teach"
                                id="btnTeachVoice"
                            >
                                <span class="voice-icon">📚</span>
                                <span class="voice-label">Teach Color</span>
                            </button>
                            <button
                                class="voice-btn voice-btn-ask"
                                id="btnAskVoice"
                            >
                                <span class="voice-icon">🧪</span>
                                <span class="voice-label">Test Color</span>
                            </button>
                        </div>
                    </div>

                    <div class="camera-section">
                        <button class="brush-btn" onclick="app.startCamera()">
                            📷 Start Camera
                        </button>
                        <video id="cameraFeed" autoplay playsinline></video>
                        <div
                            style="
                                margin-top: 8px;
                                display: flex;
                                gap: 8px;
                                justify-content: center;
                                flex-wrap: wrap;
                            "
                        >
                            <button
                                class="brush-btn"
                                onclick="app.captureAndTeach()"
                            >
                                📸 Teach This Color
                            </button>
                            <button
                                class="brush-btn"
                                onclick="app.captureAndTest()"
                            >
                                🔍 Test This Color
                            </button>
                        </div>
                    </div>
                    <button
                        class="brush-btn"
                        id="cameraToggleBtn"
                        onclick="app.toggleCamera()"
                    >
                        📷 Camera Sort
                    </button>

                    <div class="conversation-box">
                        <div class="subtitle-label">💬 Conversation</div>
                        <div
                            class="conversation-scroll"
                            id="conversationScroll"
                        ></div>
                    </div>

                    <div class="status-bar" id="statusBar">
                        ✅ Ready! Show a colored object and teach me.
                    </div>
                </div>
            </div>
        </div>

        <script>
            // ================================================================
            //  1. CONFIGURATION
            // ================================================================

            const CONFIG = {
                apiEndpoint: "http://localhost:8080/completion",
                apiTimeout: 30000,
                temperature: 0.0,
                maxTokens: 20,
                ttsEnabled: true,
                ttsRate: 1.0,
                ttsPitch: 1.0,
                sttEnabled: true,
                sttLanguage: "en-US",
                showTranscripts: true,
                autoScroll: true,
            };

            // ================================================================
            //  2. UTILITY FUNCTIONS
            // ================================================================

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            function getTime() {
                return new Date().toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit",
                });
            }

            function canvasToBase64(canvas) {
                return canvas.toDataURL("image/png").split(",")[1];
            }

            // ================================================================
            //  3. TEXT-TO-SPEECH (TTS)
            // ================================================================

            function speakText(text, opts = {}) {
                if (!CONFIG.ttsEnabled && !opts.force) return;
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = opts.rate ?? CONFIG.ttsRate;
                utterance.pitch = opts.pitch ?? CONFIG.ttsPitch;
                utterance.lang = "en-US";
                if (opts.onEnd) utterance.onend = opts.onEnd;
                if (window.speechSynthesis) {
                    window.speechSynthesis.speak(utterance);
                }
            }

            // ================================================================
            //  4. SPEECH-TO-TEXT (STT) — ONE-TIME PERMISSION
            // ================================================================

            let sttPermissionGranted = false;

            function requestMicrophonePermission() {
                return new Promise((resolve, reject) => {
                    const SpeechRecognition =
                        window.SpeechRecognition ||
                        window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        reject(new Error("Speech recognition not supported"));
                        return;
                    }
                    const temp = new SpeechRecognition();
                    temp.lang = CONFIG.sttLanguage;
                    temp.interimResults = false;
                    temp.maxAlternatives = 1;

                    temp.onstart = () => {
                        sttPermissionGranted = true;
                        temp.stop();
                        resolve();
                    };
                    temp.onerror = (e) => {
                        if (e.error === "not-allowed") {
                            reject(new Error("Microphone permission denied"));
                        } else {
                            sttPermissionGranted = true;
                            temp.stop();
                            resolve();
                        }
                    };
                    temp.onend = () => {
                        if (!sttPermissionGranted) {
                            sttPermissionGranted = true;
                        }
                        resolve();
                    };

                    try {
                        temp.start();
                    } catch (e) {
                        reject(e);
                    }

                    setTimeout(() => {
                        if (!sttPermissionGranted) {
                            sttPermissionGranted = true;
                            try {
                                temp.stop();
                            } catch (_) {}
                            resolve();
                        }
                    }, 3000);
                });
            }

            function listenForSpeech(opts = {}) {
                return new Promise(async (resolve, reject) => {
                    if (!sttPermissionGranted) {
                        try {
                            await requestMicrophonePermission();
                        } catch (err) {
                            reject(err);
                            return;
                        }
                    }

                    const SpeechRecognition =
                        window.SpeechRecognition ||
                        window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        reject(new Error("Speech recognition not supported"));
                        return;
                    }

                    const recognition = new SpeechRecognition();
                    recognition.lang = opts.language || CONFIG.sttLanguage;
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        if (opts.onStart) opts.onStart();
                    };
                    recognition.onresult = (event) => {
                        const transcript =
                            event.results[0][0].transcript.trim();
                        if (opts.onResult) opts.onResult(transcript);
                        resolve(transcript);
                    };
                    recognition.onerror = (event) => {
                        reject(new Error(`Speech error: ${event.error}`));
                    };
                    recognition.onend = () => {
                        if (opts.onEnd) opts.onEnd();
                    };

                    try {
                        recognition.start();
                    } catch (e) {
                        reject(e);
                    }
                });
            }

            // ================================================================
            //  5. VISION API — SIMPLE PROMPT + COLOR PARSING
            // ================================================================

            // All possible color names we care about
            const COLOR_LIST = [
                "red",
                "blue",
                "yellow",
                "green",
                "orange",
                "purple",
                "pink",
                "brown",
                "black",
                "white",
                "grey",
                "gray",
                "violet",
                "indigo",
                "teal",
                "cyan",
                "magenta",
                "lime",
                "maroon",
                "navy",
                "olive",
                "silver",
                "gold",
                "coral",
                "crimson",
                "khaki",
                "lavender",
                "turquoise",
                "tan",
                "plum",
                "orchid",
                "mint",
                "peach",
                "salmon",
            ];

            /**
             * Extract a color name from any text response.
             * Returns the matched color or null if no color found.
             */
            function extractColorFromText(text) {
                const lower = text.toLowerCase();
                // Try exact match first
                for (const color of COLOR_LIST) {
                    // Look for the color as a whole word
                    const regex = new RegExp(`\\b${color}\\b`, "i");
                    if (regex.test(lower)) {
                        return color;
                    }
                }
                // If no match, try to find any color in the list
                for (const color of COLOR_LIST) {
                    if (lower.includes(color)) {
                        return color;
                    }
                }
                return null;
            }

            async function detectColor(imageBase64) {
                const endpoint = CONFIG.apiEndpoint;

                // Simple, clean prompt
                const prompt = `[img-100]\nWhat is the color of the object being held in the hand? Answer with one word, e.g red, blue, white, etc`;

                const payload = {
                    prompt: prompt,
                    image_data: [{ data: imageBase64, id: 100 }],
                    n_predict: CONFIG.maxTokens,
                    temperature: CONFIG.temperature,
                    stream: false,
                };

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                    signal: AbortSignal.timeout(CONFIG.apiTimeout),
                });

                if (!response.ok) {
                    throw new Error(`Vision API error: ${response.status}`);
                }

                const data = await response.json();
                const raw = (data.content || data.response || "").trim();

                // Extract color from the response using our parser
                const detected = extractColorFromText(raw);
                return detected;
            }

            // ================================================================
            //  6. COLOR STORE — SIMPLE LIST OF COLOR NAMES
            // ================================================================

            const ColorStore = {
                addColor(color) {
                    const colors = this.getAllColors();
                    const normalized = color.toLowerCase().trim();
                    if (!colors.includes(normalized)) {
                        colors.push(normalized);
                        localStorage.setItem(
                            "known_colors",
                            JSON.stringify(colors),
                        );
                        return true;
                    }
                    return false;
                },

                removeColor(color) {
                    const colors = this.getAllColors();
                    const normalized = color.toLowerCase().trim();
                    const index = colors.indexOf(normalized);
                    if (index !== -1) {
                        colors.splice(index, 1);
                        localStorage.setItem(
                            "known_colors",
                            JSON.stringify(colors),
                        );
                        return true;
                    }
                    return false;
                },

                getAllColors() {
                    const stored = localStorage.getItem("known_colors");
                    if (!stored) return [];
                    try {
                        const parsed = JSON.parse(stored);
                        return Array.isArray(parsed) ? parsed : [];
                    } catch {
                        return [];
                    }
                },

                knowsColor(color) {
                    const colors = this.getAllColors();
                    return colors.includes(color.toLowerCase().trim());
                },

                clearAll() {
                    localStorage.removeItem("known_colors");
                },
            };

            // ================================================================
            //  7. APP — MAIN CONTROLLER
            // ================================================================

            const app = {};

            app.state = {
                mode: "color",
                isListening: false,
                cameraActive: false,
                cameraStream: null,
                currentCapture: null,
            };

            app.dom = {
                statusBar: document.getElementById("statusBar"),
                conversationScroll:
                    document.getElementById("conversationScroll"),
                binsContainer: document.getElementById("binsContainer"),
                rulesList: document.getElementById("rulesList"),
                objectEmoji: document.getElementById("objectEmoji"),
                objectLabel: document.getElementById("objectLabel"),
                btnTeach: document.getElementById("btnTeachVoice"),
                btnAsk: document.getElementById("btnAskVoice"),
                cameraFeed: document.getElementById("cameraFeed"),
                cameraToggleBtn: document.getElementById("cameraToggleBtn"),
            };

            // ================================================================
            //  8. CONVERSATION HELPER
            // ================================================================

            app.addConversation = function (
                text,
                sender = "system",
                opts = {},
            ) {
                const scroll = this.dom.conversationScroll;
                const entry = document.createElement("div");
                entry.className = `conv-entry ${sender}`;

                const time = getTime();
                let label = "";
                if (sender === "user") label = "👤 You";
                else if (sender === "ai") label = "🤖 AI";
                else label = "📢 System";

                let html = `<span class="speaker">${label}</span> <span class="timestamp">${time}</span><br>`;
                html += escapeHtml(text);

                if (opts.transcript && sender === "user") {
                    html += `<div class="transcript-note">🎤 Heard: "${escapeHtml(opts.transcript)}"</div>`;
                }
                if (opts.spoken && sender === "ai") {
                    html += `<div class="transcript-note">🔊 Spoken aloud</div>`;
                }

                entry.innerHTML = html;
                scroll.appendChild(entry);

                if (CONFIG.autoScroll) {
                    scroll.scrollTop = scroll.scrollHeight;
                }

                return entry;
            };

            app.setStatus = function (text, type = "") {
                const el = this.dom.statusBar;
                el.textContent = text;
                el.className = "status-bar " + (type || "");
            };

            app.updateRules = function () {
                const colors = ColorStore.getAllColors();
                const el = this.dom.rulesList;

                if (colors.length === 0) {
                    el.innerHTML =
                        '<em style="color:#94a3b8">No colors learned yet</em>';
                    return;
                }

                el.innerHTML = colors
                    .map((c) => {
                        return `<div class="rule-item">
                ${c}
                <span class="delete-rule" data-color="${c}" title="Delete '${c}' from known colors">✕</span>
              </div>`;
                    })
                    .join("");

                el.querySelectorAll(".delete-rule").forEach((btn) => {
                    btn.addEventListener("click", (e) => {
                        const color = e.target.dataset.color;
                        if (confirm(`Remove "${color}" from known colors?`)) {
                            ColorStore.removeColor(color);
                            app.updateRules();
                            app.setStatus(`🗑️ Removed "${color}"`, "info");
                            app.addConversation(
                                `Removed "${color}" from known colors.`,
                                "system",
                            );
                            speakText(`Removed ${color}.`, { rate: 1.0 });
                        }
                    });
                });
            };

            app.renderBins = function () {
                const container = this.dom.binsContainer;
                let bins = [];

                if (this.state.mode === "color") {
                    bins = [
                        {
                            key: "red",
                            label: "RED",
                            emoji: "🔴",
                            color: "#ef4444",
                        },
                        {
                            key: "blue",
                            label: "BLUE",
                            emoji: "🔵",
                            color: "#3b82f6",
                        },
                        {
                            key: "yellow",
                            label: "YELLOW",
                            emoji: "🟡",
                            color: "#eab308",
                        },
                    ];
                } else {
                    bins = [
                        {
                            key: "big",
                            label: "BIG",
                            emoji: "📦",
                            color: "#8b5cf6",
                        },
                        {
                            key: "small",
                            label: "SMALL",
                            emoji: "📍",
                            color: "#a78bfa",
                        },
                    ];
                }

                container.innerHTML = bins
                    .map(
                        (bin) => `
              <div class="bin" data-key="${bin.key}" onclick="app.selectBin('${bin.key}')" style="border-color: ${bin.color}">
                <div class="bin-emoji">${bin.emoji}</div>
                <div class="bin-label">${bin.label}</div>
              </div>
            `,
                    )
                    .join("");
            };

            app.selectBin = function (key) {
                document
                    .querySelectorAll(".bin")
                    .forEach((b) => b.classList.remove("selected"));
                const el = document.querySelector(`[data-key="${key}"]`);
                if (el) el.classList.add("selected");
                this.setStatus(`Selected: ${key} bin`, "info");
            };

            // ================================================================
            //  9. CAMERA MANAGEMENT
            // ================================================================

            app.toggleCamera = function () {
                if (this.state.cameraActive) {
                    this.stopCamera();
                } else {
                    this.startCamera();
                }
            };

            app.startCamera = async function () {
                const video = this.dom.cameraFeed;

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                    });
                    this.state.cameraStream = stream;
                    video.srcObject = stream;
                    this.state.cameraActive = true;
                    this.dom.cameraToggleBtn.textContent = "📷 Stop Camera";
                    this.setStatus(
                        "📷 Camera started. Show a colored object and teach me!",
                        "info",
                    );
                    this.addConversation(
                        "📷 Camera started. Show me a colored object and I'll learn it!",
                        "system",
                    );
                    speakText(
                        "Camera started. Show me a colored object and teach me!",
                        { rate: 1.0 },
                    );
                } catch (err) {
                    this.setStatus(`⚠️ Camera error: ${err.message}`, "error");
                    this.addConversation(
                        `Camera error: ${err.message}`,
                        "system",
                    );
                }
            };

            app.stopCamera = function () {
                if (this.state.cameraStream) {
                    this.state.cameraStream
                        .getTracks()
                        .forEach((t) => t.stop());
                    this.state.cameraStream = null;
                }
                this.dom.cameraFeed.srcObject = null;
                this.state.cameraActive = false;
                this.dom.cameraToggleBtn.textContent = "📷 Camera Sort";
                this.setStatus("Camera stopped.", "info");
                this.addConversation("📷 Camera stopped.", "system");
            };

            app.captureFrame = function () {
                const video = this.dom.cameraFeed;
                if (!video.srcObject) {
                    this.setStatus("⚠️ Start camera first!", "error");
                    return null;
                }

                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth || 320;
                canvas.height = video.videoHeight || 240;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const base64 = canvasToBase64(canvas);
                this.state.currentCapture = base64;
                return base64;
            };

            // ================================================================
            //  10. CORE ACTIONS: TEACH & TEST
            // ================================================================

            app.captureAndTeach = async function () {
                const base64 = this.captureFrame();
                if (!base64) return;

                this.setStatus("🎤 Tell me the color name!", "info");
                this.addConversation(
                    "📸 Captured image. What color is this?",
                    "system",
                );
                speakText("What color is this? Tell me!", { rate: 1.1 });

                try {
                    const transcript = await listenForSpeech({
                        onResult: (text) => {
                            this.addConversation(`Heard: "${text}"`, "system", {
                                transcript: text,
                            });
                        },
                    });

                    if (transcript) {
                        const clean = transcript.toLowerCase().trim();
                        const color = this._extractColorName(clean);
                        if (color) {
                            const added = ColorStore.addColor(color);
                            this.updateRules();
                            if (added) {
                                const msg = `✅ Added "${color}" to known colors!`;
                                this.setStatus(msg, "success");
                                this.addConversation(
                                    `I added "${color}" to my known colors! 🎉`,
                                    "ai",
                                    { spoken: true },
                                );
                                speakText(
                                    `I added ${color} to my known colors!`,
                                    { rate: 1.0 },
                                );
                                this.dom.objectLabel.textContent = `Learned: ${color}`;
                                this.dom.objectEmoji.textContent =
                                    this._colorEmoji(color);
                            } else {
                                const msg = `ℹ️ "${color}" is already in my known colors.`;
                                this.setStatus(msg, "info");
                                this.addConversation(
                                    `"${color}" is already in my known colors.`,
                                    "ai",
                                    { spoken: true },
                                );
                                speakText(`${color} is already known.`, {
                                    rate: 1.0,
                                });
                            }
                        } else {
                            this.setStatus(
                                `Couldn't understand. Say "this is red" or just "red".`,
                                "error",
                            );
                            this.addConversation(
                                `I couldn't understand "${clean}". Please say "this is red" or just the color name.`,
                                "ai",
                                { spoken: true },
                            );
                            speakText(
                                `Please say "this is red" or just the color name.`,
                                { rate: 1.0 },
                            );
                        }
                    }
                } catch (err) {
                    this.setStatus(`Voice error: ${err.message}`, "error");
                    this.addConversation(
                        `Voice error: ${err.message}`,
                        "system",
                    );
                }
            };

            app.captureAndTest = async function () {
                const base64 = this.captureFrame();
                if (!base64) return;

                this.setStatus("🤔 AI is looking...", "info");
                this.addConversation(
                    "📸 Captured image. Analyzing color...",
                    "system",
                );

                try {
                    const detected = await detectColor(base64);

                    if (!detected) {
                        this.setStatus(
                            "⚠️ Could not detect a color. Try again with better lighting.",
                            "error",
                        );
                        this.addConversation(
                            "I couldn't detect a color. Try again with better lighting.",
                            "ai",
                            { spoken: true },
                        );
                        speakText("I couldn't detect a color. Try again.", {
                            rate: 1.0,
                        });
                        return;
                    }

                    this.addConversation(
                        `I see the color: "${detected}"`,
                        "system",
                    );

                    if (ColorStore.knowsColor(detected)) {
                        const msg = `🎉 I know this color! It's ${detected}!`;
                        this.setStatus(msg, "success");
                        this.addConversation(
                            `I know this color! It's "${detected}"! 🎉`,
                            "ai",
                            { spoken: true },
                        );
                        speakText(`I know this color! It's ${detected}!`, {
                            rate: 1.0,
                        });
                        this.dom.objectLabel.textContent = `Known: ${detected}`;
                        this.dom.objectEmoji.textContent =
                            this._colorEmoji(detected);
                    } else {
                        const msg = `🤔 I see "${detected}" but I don't know this color yet. Can you teach me?`;
                        this.setStatus(msg, "error");
                        this.addConversation(
                            `I see the color "${detected}" but I don't know it yet. Can you teach me? 📚`,
                            "ai",
                            { spoken: true },
                        );
                        speakText(
                            `I see ${detected} but I don't know this color. Can you teach me?`,
                            { rate: 1.0 },
                        );
                        this.dom.objectLabel.textContent = `Unknown: ${detected}`;
                        this.dom.objectEmoji.textContent = "❓";
                    }
                } catch (err) {
                    this.setStatus(
                        `⚠️ Vision API error: ${err.message}`,
                        "error",
                    );
                    this.addConversation(
                        `Vision API error: ${err.message}`,
                        "system",
                    );
                    console.error(err);
                }
            };

            // ================================================================
            //  11. VOICE HANDLERS
            // ================================================================

            app.startTeachVoice = async function () {
                if (this.state.isListening) return;
                const base64 = this.captureFrame();
                if (!base64) {
                    this.setStatus("📷 Start camera first!", "error");
                    return;
                }
                this.state.mode = "teach";
                await this._listenAndAct(base64);
            };

            app.startAskVoice = async function () {
                if (this.state.isListening) return;
                const base64 = this.captureFrame();
                if (!base64) {
                    this.setStatus("📷 Start camera first!", "error");
                    return;
                }
                this.state.mode = "test";
                await this._listenAndAct(base64);
            };

            app._listenAndAct = async function (base64) {
                this.state.isListening = true;
                const btn =
                    this.state.mode === "teach"
                        ? this.dom.btnTeach
                        : this.dom.btnAsk;
                btn.classList.add("listening");

                this.setStatus("🎤 Listening... speak now!", "info");
                this.addConversation("🎤 Listening... speak now!", "system");

                try {
                    const transcript = await listenForSpeech({
                        onResult: (text) => {
                            this.addConversation(`Heard: "${text}"`, "system", {
                                transcript: text,
                            });
                        },
                    });

                    this.state.isListening = false;
                    btn.classList.remove("listening");

                    if (transcript) {
                        const clean = transcript.toLowerCase().trim();
                        this.addConversation(`You said: "${clean}"`, "user", {
                            transcript: clean,
                        });

                        // Check for "what color is this?" or similar questions
                        if (
                            clean.includes("what color") ||
                            clean.includes("what is this") ||
                            clean.includes("identify") ||
                            clean.includes("tell me") ||
                            clean.includes("what's this") ||
                            clean.includes("test")
                        ) {
                            await this.captureAndTest();
                            return;
                        }

                        // Otherwise, treat as teach
                        const color = this._extractColorName(clean);
                        if (color) {
                            const added = ColorStore.addColor(color);
                            this.updateRules();
                            if (added) {
                                const msg = `✅ Added "${color}" to known colors!`;
                                this.setStatus(msg, "success");
                                this.addConversation(
                                    `I added "${color}" to my known colors! 🎉`,
                                    "ai",
                                    { spoken: true },
                                );
                                speakText(
                                    `I added ${color} to my known colors!`,
                                    { rate: 1.0 },
                                );
                                this.dom.objectLabel.textContent = `Learned: ${color}`;
                                this.dom.objectEmoji.textContent =
                                    this._colorEmoji(color);
                            } else {
                                const msg = `ℹ️ "${color}" is already in my known colors.`;
                                this.setStatus(msg, "info");
                                this.addConversation(
                                    `"${color}" is already in my known colors.`,
                                    "ai",
                                    { spoken: true },
                                );
                                speakText(`${color} is already known.`, {
                                    rate: 1.0,
                                });
                            }
                        } else {
                            this.setStatus(
                                `Couldn't understand. Say "this is red" or just "red".`,
                                "error",
                            );
                            this.addConversation(
                                `I couldn't understand "${clean}". Please say "this is red" or just the color name.`,
                                "ai",
                                { spoken: true },
                            );
                            speakText(
                                `Please say "this is red" or just the color name.`,
                                { rate: 1.0 },
                            );
                        }
                    }
                } catch (err) {
                    this.state.isListening = false;
                    btn.classList.remove("listening");
                    this.setStatus(`Voice error: ${err.message}`, "error");
                    this.addConversation(
                        `Voice error: ${err.message}`,
                        "system",
                    );
                }
            };

            app._extractColorName = function (text) {
                const match = text.match(
                    /(?:this is|it'?s a|teach|learn|color)\s+(\w+)/i,
                );
                if (match) return match[1].toLowerCase().trim();

                const words = text.replace(/[^\w\s]/g, "").split(/\s+/);
                const stopWords = new Set([
                    "this",
                    "is",
                    "a",
                    "the",
                    "my",
                    "i",
                    "am",
                    "it",
                    "its",
                    "to",
                    "of",
                    "for",
                    "and",
                    "or",
                ]);
                const filtered = words.filter(
                    (w) => !stopWords.has(w) && w.length > 1,
                );
                return filtered.length > 0
                    ? filtered[filtered.length - 1]
                    : null;
            };

            app._colorEmoji = function (color) {
                const map = {
                    red: "🔴",
                    blue: "🔵",
                    yellow: "🟡",
                    green: "🟢",
                    purple: "🟣",
                    orange: "🟠",
                    brown: "🟤",
                    black: "⚫",
                    white: "⚪",
                    pink: "🩷",
                    grey: "⚪",
                    gray: "⚪",
                };
                return map[color] || "❓";
            };

            app.setMode = function (mode) {
                this.state.mode = mode;
                document.querySelectorAll(".mode-btn").forEach((btn, i) => {
                    btn.classList.toggle(
                        "active",
                        (mode === "color" && i === 0) ||
                            (mode === "size" && i === 1),
                    );
                });
                this.renderBins();
                this.setStatus(`Mode: ${mode} sorting`, "success");
                this.addConversation(
                    `Switched to ${mode} sorting mode.`,
                    "system",
                );
                speakText(`Now sorting by ${mode}!`, { rate: 1.0 });
            };

            // ================================================================
            //  12. INITIALIZATION
            // ================================================================

            document.addEventListener("DOMContentLoaded", () => {
                app.renderBins();
                app.updateRules();

                app.dom.btnTeach.addEventListener("click", () =>
                    app.startTeachVoice(),
                );
                app.dom.btnAsk.addEventListener("click", () =>
                    app.startAskVoice(),
                );
                app.dom.cameraToggleBtn.addEventListener("click", () =>
                    app.toggleCamera(),
                );

                document.addEventListener("keydown", (e) => {
                    if (e.key === "t" || e.key === "T") app.startTeachVoice();
                    if (e.key === "r" || e.key === "R") app.startAskVoice();
                    if (e.key === "c" || e.key === "C") app.toggleCamera();
                });

                app.setStatus(
                    "✅ Ready! Show a colored object and teach me.",
                    "success",
                );
                app.addConversation(
                    '🔷 Welcome! Show me a colored object and say "teach red", "test", or "what color is this?"',
                    "ai",
                    { spoken: true },
                );
                speakText(
                    'Welcome! Show me a colored object and teach me, or ask "what color is this?"',
                    { rate: 1.0 },
                );

                requestMicrophonePermission()
                    .then(() =>
                        console.log("✅ Microphone permission granted."),
                    )
                    .catch((err) =>
                        console.warn(
                            "⚠️ Microphone permission denied:",
                            err.message,
                        ),
                    );

                console.log(
                    "🔷 Lesson 2 initialized. Known colors:",
                    ColorStore.getAllColors(),
                );
            });

            window.app = app;
            window.ColorStore = ColorStore;
        </script>
    </body>
</html>
