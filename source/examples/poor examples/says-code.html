<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Robot Big Toy House Game</title>
    <style>
        :root {
            --sky: #A0E7E5;
            --grass: #98D7C2;
            --wood: #8D5B4C;
            --wall-color: #FF6B6B;
            --roof-color: #FFD93D;
            --door-color: #6C5CE7;
            --window-color: #74B9FF;
            --tree-leaves: #2ECC71;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--sky);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        /* Scaled up container optimized for 14-inch tablets */
        .container {
            width: 1100px;
            height: 800px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 20px 0px rgba(0,0,0,0.15);
            text-align: center;
            border: 10px solid #fff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .header-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        h1 {
            color: #FF6B6B;
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 3px 3px #fff;
        }

        .level-badge {
            background: #FFD93D;
            color: #474747;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 20px;
            border: 4px solid #fff;
            box-shadow: 0 5px 0px rgba(0,0,0,0.1);
        }

        .status-box {
            background-color: #FFF9E6;
            border: 5px dashed #FFD93D;
            padding: 20px;
            margin: 15px 0;
            border-radius: 24px;
            font-size: 2.2rem;
            font-weight: bold;
            color: #474747;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-zone {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            margin-top: 10px;
        }

        /* Massive Target Drop Area */
        .house-preview {
            width: 480px;
            height: 480px;
            border: 8px dashed #B2BEC3;
            border-radius: 30px;
            position: relative;
            background: #F9F9F9;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .house-part {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0.4);
            pointer-events: none;
        }

        .house-part.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* --- Level 1 Building Elements --- */
        #part-floor {
            width: 400px;
            height: 45px;
            background-color: var(--wood);
            bottom: 30px;
            left: 40px;
            border-radius: 10px;
        }

        #part-walls {
            width: 320px;
            height: 180px;
            background-color: var(--wall-color);
            bottom: 75px;
            left: 80px;
            border-radius: 8px;
        }

        #part-roof {
            width: 0;
            height: 0;
            border-left: 190px solid transparent;
            border-right: 190px solid transparent;
            border-bottom: 140px solid var(--roof-color);
            bottom: 255px;
            left: 50px;
        }

        #part-door {
            width: 80px;
            height: 130px;
            background-color: var(--door-color);
            bottom: 75px;
            left: 200px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        /* --- Level 2 Building Elements --- */
        #part-window {
            width: 70px;
            height: 70px;
            background-color: var(--window-color);
            border: 6px solid #fff;
            border-radius: 15px;
            bottom: 140px;
            left: 110px;
        }

        #part-window2 {
            width: 70px;
            height: 70px;
            background-color: var(--window-color);
            border: 6px solid #fff;
            border-radius: 15px;
            bottom: 140px;
            left: 300px;
        }

        #part-trunk {
            width: 35px;
            height: 100px;
            background-color: var(--wood);
            bottom: 30px;
            left: 415px;
            border-radius: 5px;
        }

        #part-leaves {
            width: 110px;
            height: 110px;
            background-color: var(--tree-leaves);
            border-radius: 50%;
            bottom: 110px;
            left: 377px;
        }

        /* Large Toy Box Block Picker Area */
        .toy-box {
            background: #E0FCFF;
            border: 6px solid #74B9FF;
            padding: 25px;
            border-radius: 30px;
            width: 440px;
            height: 440px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            justify-items: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Large Drag elements shapes */
        .drag-block {
            cursor: grab;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            width: 160px;
            height: 140px;
        }

        .drag-block:active {
            cursor: grabbing;
            transform: scale(1.15);
        }

        .block-floor { width: 150px; height: 30px; background: var(--wood); border-radius: 6px; }
        .block-walls { width: 120px; height: 90px; background: var(--wall-color); border-radius: 6px; }
        .block-roof { width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 65px solid var(--roof-color); }
        .block-door { width: 55px; height: 95px; background: var(--door-color); border-top-left-radius: 15px; border-top-right-radius: 15px; }
        
        .block-window { width: 70px; height: 70px; background: var(--window-color); border: 5px solid #fff; border-radius: 10px; }
        .block-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .block-leaves { width: 70px; height: 70px; background: var(--tree-leaves); border-radius: 50%; }
        .block-trunk { width: 20px; height: 40px; background: var(--wood); margin-top: -5px; }

        .drag-block.placed {
            opacity: 0.2;
            pointer-events: none;
            transform: scale(0.8);
        }

        .drag-block.hidden {
            display: none;
        }

        /* Interface Action Buttons */
        .btn-main {
            background: #FF7675;
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 2.5rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 0 #D63031;
            transition: all 0.1s;
            font-family: inherit;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
        }

        .btn-main:active {
            transform: translate(-50%, -46%);
            box-shadow: 0 4px 0 #D63031;
        }

        .sparkle {
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(-50%, -58%); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-zone">
        <h1>Robot House! 🤖🏠</h1>
        <div class="level-badge" id="level-indicator">Level 1</div>
    </div>
    
    <button id="btn-start" class="btn-main sparkle">▶ PLAY!</button>

    <div class="status-box" id="status-text">Tap PLAY to hear the Robot!</div>

    <div class="game-zone">
        <!-- Giant Target Box Area -->
        <div class="house-preview" id="drop-target">
            <!-- Level 1 Items -->
            <div id="part-floor" class="house-part"></div>
            <div id="part-walls" class="house-part"></div>
            <div id="part-roof" class="house-part"></div>
            <div id="part-door" class="house-part"></div>
            
            <!-- Level 2 Items -->
            <div id="part-window" class="house-part"></div>
            <div id="part-window2" class="house-part"></div>
            <div id="part-trunk" class="house-part"></div>
            <div id="part-leaves" class="house-part"></div>
        </div>

        <!-- Large Size Toy Box Items -->
        <div class="toy-box" id="toy-box-container">
            <!-- Level 1 Block items loaded default -->
            <div class="drag-block L1" draggable="true" id="drag-floor" data-item="floor"><div class="block-floor"></div></div>
            <div class="drag-block L1" draggable="true" id="drag-walls" data-item="walls"><div class="block-walls"></div></div>
            <div class="drag-block L1" draggable="true" id="drag-roof" data-item="roof"><div class="block-roof"></div></div>
            <div class="drag-block L1" draggable="true" id="drag-door" data-item="door"><div class="block-door"></div></div>

            <!-- Level 2 Block items loaded hidden default -->
            <div class="drag-block L2 hidden" draggable="true" id="drag-window" data-item="window"><div class="block-window"></div></div>
            <div class="drag-block L2 hidden" draggable="true" id="drag-window2" data-item="window2"><div class="block-window"></div></div>
            <div class="drag-block L2 hidden" draggable="true" id="drag-trunk" data-item="trunk"><div class="block-trunk"></div></div>
            <div class="drag-block L2 hidden" draggable="true" id="drag-leaves" data-item="leaves"><div class="block-tree"><div class="block-leaves"></div><div class="block-trunk"></div></div></div>
        </div>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    
    // Level Sequences
    const level1Sequence = ['floor', 'walls', 'roof', 'door'];
    const level2Sequence = ['window', 'window2', 'trunk', 'leaves'];
    
    let currentLevel = 1;
    let currentStep = 0;
    let robotVoice = null;
    let audioCtx = null;

    const btnStart = document.getElementById('btn-start');
    const statusText = document.getElementById('status-text');
    const dragBlocks = document.querySelectorAll('.drag-block');
    const dropTarget = document.getElementById('drop-target');
    const levelIndicator = document.getElementById('level-indicator');

    // Synthesis Voice Settings
    function initVoice() {
        const voices = synth.getVoices();
        robotVoice = voices.find(voice => voice.lang.startsWith('en'));
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initVoice;
    }

    function speak(text) {
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (robotVoice) utterance.voice = robotVoice;
        utterance.pitch = 1.0; // High and energetic for toddlers
        utterance.rate = 0.80; // Slow cadence pace
        synth.speak(utterance);
    }

    function updateStatus(text) {
        statusText.innerText = text;
        speak(text);
    }

    // Sound Synthesizer Functions (Web Audio API)
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSuccessSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        
        // Happy ascending ding sound effect sequence
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.2);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    function playErrorSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        
        // Funny boing error sliding sound downward
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.3);
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function playWinSound() {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major Chord
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (index * 0.1));
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.1) + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + (index * 0.1));
            osc.stop(audioCtx.currentTime + (index * 0.1) + 0.5);
        });
    }

    // Engine Start Initialization Trigger
    btnStart.addEventListener('click', () => {
        initVoice();
        initAudio();
        btnStart.style.display = 'none';
        btnStart.classList.remove('sparkle');
        
        if (currentLevel === 1) {
            resetGame();
            updateStatus("Let's build a house! Drag the brown floor block first!");
        } else {
            startLevel2();
        }
    });

    // Touch and Drag API Setup
    dragBlocks.forEach(block => {
        block.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', e.target.id);
        });

        // Touch layout mechanics mapping for large view screen sizes
        let startX = 0, startY = 0;
        block.addEventListener('touchstart', (e) => {
            if(block.classList.contains('placed')) return;
            initAudio();
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            block.style.position = 'fixed';
            block.style.zIndex = '1000';
            updateTouchPosition(block, touch);
        });

        block.addEventListener('touchmove', (e) => {
            if(block.classList.contains('placed')) return;
            e.preventDefault();
            updateTouchPosition(block, e.touches[0]);
        });

        block.addEventListener('touchend', (e) => {
            if(block.classList.contains('placed')) return;
            const rect = dropTarget.getBoundingClientRect();
            const touch = e.changedTouches[0];
            
            if (touch.clientX > rect.left && touch.clientX < rect.right &&
                touch.clientY > rect.top && touch.clientY < rect.bottom) {
                handlePlacement(block.getAttribute('data-item'), block);
            } else {
                block.style.position = 'static';
            }
        });
    });

    function updateTouchPosition(element, touch) {
        element.style.left = (touch.clientX - 75) + 'px';
        element.style.top = (touch.clientY - 65) + 'px';
    }

    dropTarget.addEventListener('dragover', (e) => e.preventDefault());
    dropTarget.addEventListener('drop', (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const draggedElement = document.getElementById(id);
        if(!draggedElement) return;
        const chosenItem = draggedElement.getAttribute('data-item');
        handlePlacement(chosenItem, draggedElement);
    });

    // Main Validation Processing Node
    function handlePlacement(chosenItem, element) {
        const activeSequence = (currentLevel === 1) ? level1Sequence : level2Sequence;
        const expectedItem = activeSequence[currentStep];

        if (chosenItem === expectedItem) {
            playSuccessSound();
            element.classList.add('placed');
            element.style.position = 'static'; 
            document.getElementById(`part-${chosenItem}`).classList.add('visible');
            currentStep++;

            if (currentLevel === 1) {
                handleLevel1Progression();
            } else {
                handleLevel2Progression();
            }
        } else {
            playErrorSound();
            speak("Oh oh! Try another block!");
            element.style.position = 'static';
        }
    }

    function handleLevel1Progression() {
        if (currentStep === 1) {
            updateStatus("Yay! Now drag the red walls block!");
        } else if (currentStep === 2) {
            updateStatus("Good job! Next, drag the yellow roof block on top!");
        } else if (currentStep === 3) {
            updateStatus("Wow! One more! Drag the purple door block!");
        } else if (currentStep === 4) {
            playWinSound();
            updateStatus("Level 1 done! Super builder! Let's make it beautiful on Level 2!");
            setTimeout(() => {
                currentLevel = 2;
                currentStep = 0;
                btnStart.innerText = "▶ Start Level 2";
                btnStart.style.display = 'inline-block';
                btnStart.classList.add('sparkle');
            }, 4500);
        }
    }

    function handleLevel2Progression() {
        if (currentStep === 1) {
            updateStatus("Awesome! Drag the second blue window block!");
        } else if (currentStep === 2) {
            updateStatus("Wonderful! Let's plant a tree! Drag the brown tree trunk next!");
        } else if (currentStep === 3) {
            updateStatus("Last one! Drag the round green leaves to the tree!");
        } else if (currentStep === 4) {
            playWinSound();
            updateStatus("Yay! You finished all levels! You built a beautiful home with a tree! High five!");
            setTimeout(() => {
                currentLevel = 1;
                btnStart.innerText = "🔄 Replay Game";
                btnStart.style.display = 'inline-block';
                btnStart.classList.add('sparkle');
            }, 5000);
        }
    }

    function startLevel2() {
        levelIndicator.innerText = "Level 2";
        // Hide Level 1 blocks, show Level 2 blocks
        document.querySelectorAll('.L1').forEach(b => b.classList.add('hidden'));
        document.querySelectorAll('.L2').forEach(b => b.classList.remove('hidden'));
        updateStatus("Level 2! Let's add decorations! Drag a blue window block onto the house!");
    }

    function resetGame() {
        currentLevel = 1;
        currentStep = 0;
        levelIndicator.innerText = "Level 1";
        
        document.querySelectorAll('.L1').forEach(b => b.classList.remove('hidden', 'placed'));
        document.querySelectorAll('.L2').forEach(b => b.classList.add('hidden', 'placed'));
        // remove 'placed' state reset rule for Level 2 nodes 
        document.querySelectorAll('.L2').forEach(b => b.classList.remove('placed'));
        
        dragBlocks.forEach(block => block.style.position = 'static');
        document.querySelectorAll('.house-part').forEach(part => part.classList.remove('visible'));
    }
</script>

</body>
</html>
