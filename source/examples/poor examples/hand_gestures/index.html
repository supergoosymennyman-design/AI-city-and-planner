<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <title>Gesture Snake | AI Hand Control with Confidence</title>
        <link rel="stylesheet" href="css/style.css" />
        <!-- TensorFlow.js from CDN (gzipped ~800KB) -->
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
        <!-- MediaPipe Hands (lite version) -->
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
        <script type="module" src="js/app.js"></script>
    </head>
    <body>
        <h1>
            ✋ Gesture Snake · <span style="color: #10b981">AI Control</span>
        </h1>
        <div id="viewport">
            <!-- Webcam feed (mirrored) -->
            <video
                id="webcam"
                width="320"
                height="240"
                autoplay
                playsinline
                muted
            ></video>
            <!-- Canvas for drawing hand skeleton overlay -->
            <canvas id="handCanvas" width="320" height="240"></canvas>
            <!-- Game canvas -->
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="controls">
            <div id="status">
                ⏳ Loading AI model... (first time: downloading 4MB)
            </div>
            <div id="sampleCounts">⬆️ Up:0 ⬇️ Down:0 ⬅️ Left:0 ➡️ Right:0</div>
            <!-- Confidence bar UI -->
            <div class="confidence-container">
                <span>🤖 Prediction confidence:</span>
                <div class="confidence-bar-bg">
                    <div
                        id="confidenceFill"
                        class="confidence-bar-fill"
                        style="width: 0%"
                    ></div>
                </div>
                <span id="confidencePercent">0%</span>
            </div>
            <div>
                <button id="btnUp" class="gesture-btn">⬆️ Capture UP</button>
                <button id="btnDown" class="gesture-btn">
                    ⬇️ Capture DOWN
                </button>
                <button id="btnLeft" class="gesture-btn">
                    ⬅️ Capture LEFT
                </button>
                <button id="btnRight" class="gesture-btn">
                    ➡️ Capture RIGHT
                </button>
            </div>
            <div>
                <button id="trainBtn" disabled>🚀 Train & Play</button>
                <button id="resetGameBtn">🔄 Reset Game</button>
            </div>
            <div id="debug">🔧 Please wait – AI model downloading...</div>
        </div>
    </body>
</html>
