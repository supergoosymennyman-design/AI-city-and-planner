<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Color the Rainbow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div id="bot">
      <span id="bot-char" role="img" aria-label="Rainbow Bot">🤖</span>
      <div id="bubble"><span id="bubble-text"></span></div>
    </div>
    <div id="score-wrap"><span id="score"></span></div>
  </div>
  <div id="stage"></div>
  <div id="bottom"></div>
  <div id="module-bar"></div>
  <button id="reset" aria-label="Reset all data">↻</button>
</div>
<div id="settings-overlay"></div>
<div id="settings-panel">
  <h3>&#9881;&#65039; Settings</h3>
</div>
<button id="settings-btn" aria-label="Settings">&#9881;</button>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/svg.js"></script>
<script src="js/conversation.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
