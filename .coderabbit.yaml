# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit — the rented, tool-agnostic PR reviewer (plan §7). It reviews EVERY PR
# regardless of which agent/model authored the code, so a teammate on a different
# editor still gets the same review. It is an accelerator, NOT the gate — CI + CODEOWNERS
# are the gate. Path instructions below target the golden rules a reasoning reviewer
# can judge semantically; the purely-mechanical rules (no-Math.random, no persisted
# floats, no cross-namespace ext redefinition) become ESLint's job once @edu/city lands.

language: en-US

reviews:
  # "chill" = comment on real issues, skip nitpicks. Revisit to "assertive" if reviews
  # are letting things through once the codebase grows.
  profile: chill
  # Don't let CodeRabbit hard-block merges; humans (CODEOWNERS) + CI decide.
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Don't waste review budget on generated / vendored / binary artifacts.
  path_filters:
    - "!**/dist/**"
    - "!**/*.min.js"
    - "!package-lock.json"
    - "!**/assets/**"
    - "!city-art/**"

  path_instructions:
    - path: "**"
      instructions: >-
        Enforce AGENTS.md golden rules. Flag: hardcoded user-facing text (must be
        externalized for i18n, incl. Canvas-drawn labels); any third-party CDN at
        runtime (libs/models must be self-hosted + pinned + SRI); anything resembling
        PII or child data (names, transcripts, camera/audio bytes) in code, logs, or
        telemetry; platform access outside `ctx` (no window.*, no globals). Check that
        comments follow the debuggability-first style: TSDoc on every export with units
        (e.g. milli-units), inline comments explaining WHY in hard-to-debug zones, and
        loud failures (specific messages + assert/invariant from @edu/debug). Flag stale
        or obvious-restating comments (comment rot).
    - path: "packages/contract/**"
      instructions: >-
        The contract is law and split-frozen. OUTER surfaces (GameModule, GameManifest,
        GameContext) are frozen — flag any change to them. INNER sim schema (CityState,
        Capability, tick) is additive-only + versioned — a changed/removed core field or
        a breaking ext-shape change requires a schemaVersion bump + migration; flag if
        missing. @edu/contract must have NO runtime React dependency (type-only imports).
    - path: "games/primary/**"
      instructions: >-
        Sim code must be deterministic and serializable. Flag: Math.random (use the
        passed rng); floats persisted into CityState (sim-critical values are integer
        milli-units, ×1000, truncating); ctx.bus used for cross-subsystem STATE (state
        flows only through namespaced CityState.ext); reading a non-dependency's
        same-tick ext value (freshness follows dependsOn); store writes from React
        render (the sim mutates only in tick/RAF).
    - path: "games/**"
      instructions: >-
        Every core instruction/feedback/action must be reachable via ≥2 channels with
        `tap` always present (manifest.a11y). Flag voice-only or camera-only core paths.
        Check the manifest carries pedagogy fields (objective, successCriteria, bigIdea,
        aiRepresentation) and that child-facing copy matches the aiRepresentation label.

chat:
  auto_reply: true
